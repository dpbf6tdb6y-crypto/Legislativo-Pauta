services:
  db:
    # Mesma major version do banco de origem no Railway (PG 18) — pg_dump/psql
    # exigem cliente >= servidor, e restaurar dump de 18 em 16 quebra.
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      # PG 18+ guarda os dados em subpasta por major version dentro de
      # /var/lib/postgresql; montar direto em .../data (padrão até o 17)
      # faz o container abortar no boot.
      - pauta_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: segov-app:producao
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      FIN_DADOS_DIR: /dados
    volumes:
      # painel Fazenda gerado no servidor (não vai na imagem; ver docker/Dockerfile)
      - ./private:/app/private:ro
      # Gestão $$$: PDFs anexados aos documentos para assinar (dados-financas/nova-lima/anexos, dono uid 1001)
      # e os arquivos da coleta. Fora do git e das imagens.
      - ./dados-financas:/dados
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Coletor da Gestão $$$ (Portal da Transparência → tabelas fin_*). Não sobe com o "docker compose up":
  # só existe enquanto a coleta roda, chamado pelo scripts/financas/coletar.sh (cron 02:30).
  coletor:
    profiles: ["coletor"]
    build:
      context: .
      dockerfile: docker/coletor.Dockerfile
    image: segov-coletor:producao
    env_file:
      - .env
    environment:
      FIN_DADOS_DIR: /dados
      PLAYWRIGHT_CANAL: chromium
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # arquivos baixados do portal (30 dias) e logs: fora do git e fora das imagens
      - ./dados-financas:/dados
    # o Chromium usa memória compartilhada; o padrão do Docker (64 MB) faz abas travarem
    shm_size: 256m
    mem_limit: 1g

volumes:
  pauta_db_data:
