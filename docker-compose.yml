services:
  db:
    # Mesma major version do banco de origem no Railway (PG 18) — pg_dump/psql
    # exigem cliente >= servidor, e restaurar dump de 18 em 16 quebra.
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      # PG 18+ guarda os dados em subpasta por major version dentro de
      # /var/lib/postgresql; montar direto em .../data (padrão até o 17)
      # faz o container abortar no boot.
      - pauta_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: segov-app:producao
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pauta_db_data:
