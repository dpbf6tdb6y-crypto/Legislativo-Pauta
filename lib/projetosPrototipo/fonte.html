const dISO = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const DIA = 864e5;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
/* Curva S de referência do planejamento físico */
const curvaS = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const planejadoEm = (p, data) => 100 * curvaS((data - p.inicio) / (p.prazo - p.inicio));

function criarProjeto(r, i) {
  const [nome, sec, gestor, eixo, tipo, orc, ini, fim, fisico, risco, diasAtu, objetivo] = r;
  const conc = fisico >= 100;
  const ajuste = (i % 5) - 2;
  const empP = conc ? 98 : Math.round(clamp((fisico + 15 + ajuste * 2) / 100) * 100);
  const liqP = conc ? 98 - (i % 3) : Math.max(0, Math.round(fisico - 3 + ajuste));
  const pagP = conc ? 96 - (i % 3) : Math.max(0, liqP - 3);
  return {
    id: 'p' + String(i + 1).padStart(2, '0'), codigo: `PE-${ini.slice(0, 4)}-${String(i + 1).padStart(3, '0')}`,
    nome, sec, gestor, eixo: EIXOS[eixo], tipo, orc: orc * 1e6, inicio: dISO(ini), prazo: dISO(fim), fisico, risco,
    atualizado: somaDias(HOJE, -diasAtu), objetivo, empP, liqP, pagP
  };
}

    execMedia: lista.length ? soma(lista, p => p.fisico) / lista.length : 0,
    pago: soma(lista, p => valorDe(p, p.pagP)),
    empenhado: soma(lista, p => valorDe(p, p.empP)),

  };
}

/* Índice de Desempenho da Secretaria (IDS), 0 a 100 */
function desempenho(secId) {
  const l = PROJETOS.filter(p => p.sec === secId);
  if (!l.length) return null;
  const orc = soma(l, p => p.orc);
  const aderencia = soma(l, p => p.orc * (p.status === 'con' ? 1 : clamp(p.fisico / Math.max(1, planejadoEm(p, HOJE))))) / orc;
  const pontualidade = 1 - l.filter(p => p.status === 'atr').length / l.length;
  const emDia = 1 - l.filter(semAtualizacao).length / l.length;
  return { ids: Math.round(50 * aderencia + 30 * pontualidade + 20 * emDia), aderencia, pontualidade, emDia, lista: l, orc };
}

}

    if (semAtualizacao(p)) add('Alto', 'Sem atualização', p, `Gestor não registra informações há ${diasSemAtu(p)} dias.`, somaDias(p.atualizado, CONFIG.diasSemAtualizacao + 1));
    if (diasRestantes(p) >= 0 && diasRestantes(p) <= 45 && p.fisico < 95) add('Alto', 'Prazo próximo', p, `Faltam ${diasRestantes(p)} dias e restam ${100 - p.fisico}% de execução física.`, HOJE);
    if (p.empP - p.liqP >= 20) add('Moderado', 'Empenho sem liquidação', p, `Diferença de ${p.empP - p.liqP} pontos entre valor empenhado e liquidado.`, p.atualizado);
  });
  PENDENCIAS.filter(d => d.venc < HOJE).forEach(d => add('Alto', 'Documento vencido', projDe(d.proj), `${d.doc}: venceu em ${fData(d.venc)}.`, d.venc));
  const ordem = { 'Crítico': 0, 'Alto': 1, 'Moderado': 2 };
  return out.sort((a, b) => ordem[a.nivel] - ordem[b.nivel] || b.data - a.data);
}

  relatorio: 'M5 3h14v18H5zM9 17v-4M12 17V8M15 17v-6',

};
const icone = (n, cls = 'w-[17px] h-[17px]') => `<svg class="${cls} flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONES[n]}"/></svg>`;

const badge = k => `<span class="badge-${k}"><span aria-hidden="true" class="text-[10px]">${STATUS[k].simbolo}</span>${STATUS[k].rotulo}</span>`;

function risco(nivel) {
  const n = { 'Baixo': 1, 'Médio': 2, 'Alto': 3 }[nivel];
  const cor = ['bg-ink-3', 'bg-st-ate', 'bg-st-atr'][n - 1];
  return `<span class="inline-flex items-center gap-2 whitespace-nowrap"><span class="inline-flex gap-[2px]" aria-hidden="true">${[1, 2, 3].map(i => `<i class="block w-[5px] h-[12px] ${i <= n ? cor : 'bg-line'}"></i>`).join('')}</span><span class="${n === 3 ? 'font-semibold text-st-atr-tx' : 'text-ink-2'}">${nivel}</span></span>`;
}

/* Barra de progresso com marcador opcional do planejado */
function barra(valor, { planejado, rotulo = 'Execução', cor = 'bg-navy-700', w = 'w-[72px]', mostra = true } = {}) {
  const v = Math.round(valor);
  return `<span class="inline-flex items-center gap-2 ${w === 'w-full' ? 'w-full' : ''}">
    <span class="relative block h-[7px] ${w === 'w-full' ? 'flex-1' : w} bg-[#E2EEF3]" role="meter" aria-label="${rotulo}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}">
      <span class="absolute inset-y-0 left-0 ${cor}" style="width:${v}%"></span>
      ${planejado != null ? `<span class="absolute -top-[3px] -bottom-[3px] w-[2px] bg-ink" style="left:calc(${Math.min(99.5, planejado)}% - 1px)" title="Planejado: ${fNum(planejado)}%"></span>` : ''}
    </span>${mostra ? `<span class="tabular-nums font-medium w-[38px] text-right">${v}%</span>` : ''}</span>`;
}

const painel = (titulo, corpo, { sub = '', acao = '', pad = true, rodape = '', cls = '' } = {}) => `
  <section class="panel ${cls}">
    <header class="panel-head"><div class="min-w-0"><h2 class="panel-title">${titulo}</h2>${sub ? `<p class="panel-sub m-0">${sub}</p>` : ''}</div>${acao}</header>
    <div class="${pad ? 'panel-body' : ''}">${corpo}</div>
    ${rodape ? `<footer class="panel-foot">${rodape}</footer>` : ''}

const kpis = (itens, cols = 'grid-cols-2 md:grid-cols-3 xl:grid-cols-6') => `
  <dl class="kpi-strip ${cols} m-0">${itens.map(k => `
    <div class="kpi" ${k.marca ? `style="box-shadow: inset 0 3px 0 ${k.marca}"` : ''}>
      <dt class="kpi-label">${k.rotulo}</dt>
      <dd class="m-0"><div class="kpi-value">${k.valor}</div>${k.nota ? `<div class="kpi-note">${k.nota}</div>` : ''}</dd>
    </div>`).join('')}</dl>`;

const cabecalho = (titulo, desc, acoes = '', trilha = []) => `
  <div class="mb-6">
    ${trilha.length ? `<nav aria-label="Trilha de navegação" class="mb-2 text-[12.5px] text-ink-3"><ol class="flex flex-wrap gap-1.5 list-none m-0 p-0">${trilha.map(([t, h]) => `<li class="flex items-center gap-1.5">${h ? `<a class="link" href="#${h}">${t}</a><span aria-hidden="true">/</span>` : `<span aria-current="page">${t}</span>`}</li>`).join('')}</ol></nav>` : ''}
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div class="min-w-0 max-w-[78ch]">
        <h1 class="m-0 text-[23px] leading-tight font-semibold text-navy-950" tabindex="-1" id="titulo">${titulo}</h1>
        ${desc ? `<p class="m-0 mt-1 text-ink-3">${desc}</p>` : ''}
      </div>
      ${acoes ? `<div class="flex flex-wrap gap-2" data-oculta-apresentacao>${acoes}</div>` : ''}
    </div>
  </div>`;

const rolagem = (html, rotulo) => `<div class="overflow-x-auto" role="region" aria-label="${rotulo}" tabindex="0">${html}</div>`;

/* Tabela simples declarativa: colunas = [{t, num, f(item)}] */
function tabela(colunas, itens, { legenda, empilha = true, vazio = 'Nenhum registro encontrado.' } = {}) {
  if (!itens.length) return `<p class="m-0 px-5 py-8 text-center text-ink-3">${vazio}</p>`;
  return rolagem(`<table class="tbl ${empilha ? 'tbl-stack' : ''}"><caption class="sr-only">${legenda}</caption>
    <thead><tr>${colunas.map(c => `<th scope="col" class="${c.num ? '!text-right' : ''}">${c.t}</th>`).join('')}</tr></thead>
    <tbody>${itens.map(it => `<tr>${colunas.map((c, i) => i === 0 ? `<th scope="row">${c.f(it)}</th>` : `<td data-l="${c.t}" class="${c.num ? 'num' : ''} ${c.cls || ''}">${c.f(it)}</td>`).join('')}</tr>`).join('')}</tbody></table>`, legenda);
}

const linkProjeto = (p, aba = '') => `<a class="link" href="#projeto-${p.id}${aba ? '-' + aba : ''}">${esc(p.nome)}</a>`;

/* ============================================================
   GRÁFICOS (SVG próprio, desenhado na largura real do contêiner)
   ============================================================ */
const GRAFICOS = new Map();
let seqGrafico = 0;
function grafico(desenhar, rotulo) {
  const id = 'viz' + (++seqGrafico);
  GRAFICOS.set(id, desenhar);
  return `<div class="viz" id="${id}" role="img" aria-label="${esc(rotulo)}"></div>`;
}
function desenharGraficos() {
  GRAFICOS.forEach((f, id) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.clientWidth > 0) f(el, el.clientWidth);
  });
}
const dica = t => `data-dica="${esc(t)}"`;

/* Linhas: series = [{nome, cor, tracejado, valores:[n|null]}] */
function graficoLinhas({ rotulos, series, max = 100, formato = v => fNum(v) + '%', hojeIdx, altura = 240, descricao }) {
  const legenda = `<ul class="flex flex-wrap gap-x-5 gap-y-1 list-none m-0 mb-2 p-0 text-[12px] text-ink-2">${series.map(s => `<li class="flex items-center gap-2"><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" stroke="${s.cor}" stroke-width="2.5" ${s.tracejado ? 'stroke-dasharray="5 3"' : ''}/></svg>${s.nome}</li>`).join('')}</ul>`;
  return legenda + grafico((el, W) => {
    const H = altura, e = 52, d = 14, t = 14, b = 26, iw = W - e - d, ih = H - t - b, n = rotulos.length;
    const x = i => e + (n === 1 ? iw / 2 : iw * i / (n - 1)), y = v => t + ih - ih * v / max;
    const passo = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 62))));
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
    [0, .25, .5, .75, 1].forEach(f => { s += `<line x1="${e}" x2="${W - d}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#E2EEF3"/><text x="${e - 8}" y="${y(max * f) + 4}" text-anchor="end">${formato(max * f, true)}</text>`; });
    rotulos.forEach((r, i) => { if (i % passo === 0) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${r}</text>`; });
    if (hojeIdx != null) s += `<line x1="${x(hojeIdx)}" x2="${x(hojeIdx)}" y1="${t}" y2="${t + ih}" stroke="#7C8796" stroke-dasharray="2 3"/><text class="strong" x="${x(hojeIdx)}" y="${t - 3}" text-anchor="middle">Hoje</text>`;
    series.forEach(se => {
      const pts = se.valores.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean);
      s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${se.cor}" stroke-width="2.25" stroke-linejoin="round" ${se.tracejado ? 'stroke-dasharray="6 4"' : ''}/>`;
      const ult = se.valores.reduce((a, v, i) => v == null ? a : i, -1);
      if (!se.tracejado && ult >= 0) s += `<circle cx="${x(ult)}" cy="${y(se.valores[ult])}" r="4.5" fill="${se.cor}" stroke="#fff" stroke-width="2"/>`;
    });
    const col = iw / Math.max(1, n - 1);
    rotulos.forEach((r, i) => {
      const txt = r + '\n' + series.filter(se => se.valores[i] != null).map(se => `${se.nome}: ${formato(se.valores[i])}`).join('\n');
      s += `<rect x="${x(i) - col / 2}" y="${t}" width="${col}" height="${ih}" fill="transparent" ${dica(txt)}/>`;
    });
    el.innerHTML = s + '</svg>';
  }, descricao);
}

/* Barras horizontais com rótulo direto */
function graficoBarras({ itens, max, formato, descricao }) {
  return grafico((el, W) => {
    const estreito = W < 460, rot = estreito ? 0 : 150, val = 92, lh = estreito ? 48 : 36, H = itens.length * lh;
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
    itens.forEach((it, i) => {
      const yy = i * lh + (estreito ? 20 : 8), w = Math.max(2, (W - rot - val) * it.valor / max);
      s += `<text x="0" y="${estreito ? i * lh + 13 : yy + 14}">${esc(it.nome)}</text>`;
      s += `<path d="M${rot} ${yy}h${w - Math.min(4, w)}q${Math.min(4, w)} 0 ${Math.min(4, w)} 4v12q0 4 -${Math.min(4, w)} 4h-${w - Math.min(4, w)}z" fill="${it.cor || '#187598'}"/>`;
      s += `<text class="strong" x="${rot + w + 8}" y="${yy + 14}">${formato(it.valor)}</text>`;
      s += `<rect x="0" y="${i * lh}" width="${W}" height="${lh}" fill="transparent" ${dica(it.nome + '\n' + formato(it.valor) + (it.extra ? '\n' + it.extra : ''))}/>`;
    });
    el.innerHTML = s + '</svg>';
  }, descricao);
}

/* Barra empilhada de situação (HTML, com 2px de respiro entre segmentos) */
function barraSituacao(lista, maximo = lista.length, alt = 'h-[18px]') {
  const partes = ORDEM_STATUS.map(k => [k, lista.filter(p => p.status === k).length]).filter(x => x[1]);
  return `<span class="flex gap-[2px] ${alt}" style="width:${100 * lista.length / maximo}%" role="img" aria-label="${partes.map(([k, n]) => `${n} ${STATUS[k].rotulo}`).join(', ')}">${partes.map(([k, n]) => `<span class="flex items-center justify-center text-[11px] font-bold ${k === 'ate' ? 'text-ink' : 'text-white'}" style="flex:${n} 1 0;background:${STATUS[k].cor}" ${dica(`${STATUS[k].rotulo}: ${n}`)}>${n}</span>`).join('')}</span>`;
}
const legendaSituacao = () => `<ul class="flex flex-wrap gap-x-4 gap-y-1 list-none m-0 p-0 text-[12px] text-ink-2">${ORDEM_STATUS.map(k => `<li class="flex items-center gap-1.5"><i class="inline-block w-[10px] h-[10px]" style="background:${STATUS[k].cor}" aria-hidden="true"></i>${STATUS[k].rotulo}</li>`).join('')}</ul>`;

function minigrafico(valores, rotulo) {
  const W = 110, H = 30, mi = Math.min(...valores), ma = Math.max(...valores), a = ma - mi || 1;
  const pts = valores.map((v, i) => [3 + (W - 6) * i / (valores.length - 1), H - 4 - (H - 8) * (v - mi) / a]);
  const u = pts[pts.length - 1];
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(rotulo)}"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#187598" stroke-width="2"/><circle cx="${u[0]}" cy="${u[1]}" r="4" fill="#146484" stroke="#fff" stroke-width="2"/></svg>`;
}

/* Copiar texto para a área de transferência com retorno ao usuário */
function aviso(msg) {
  const a = document.getElementById('aviso');
  a.textContent = msg; a.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(() => (a.hidden = true), 4500);
}
function copiar(texto, msg) {
  const falha = () => {
    const box = document.getElementById('copia-manual');
    box.hidden = false; const ta = box.querySelector('textarea'); ta.value = texto; ta.focus(); ta.select();
  };
  try { navigator.clipboard.writeText(texto).then(() => aviso(msg), falha); } catch (e) { falha(); }
}

/* ============================================================
   DASHBOARD EXECUTIVO: leitura da carteira em menos de 30 s
   ============================================================ */
const VIEWS = {};

function sinteseExecutiva() {
  const r = resumoCarteira(), atr = r.por.atr;
  const pior = ranking().slice(-1)[0];
  const orcAtr = soma(atr, p => p.orc);
  const p1 = filaPrioridades().filter(p => nivelPrioridade(prioridade(p)) === 'P1').length;
  return `<section aria-label="Síntese executiva" class="bg-navy-50 border border-navy-100 text-ink rounded-[3px] px-6 py-5 mb-4 flex flex-wrap items-center gap-x-10 gap-y-4">
    <p class="m-0 flex-1 min-w-[260px] text-[16.5px] leading-relaxed">
      <strong class="font-semibold">${atr.length} dos ${r.total} projetos estão atrasados</strong> e concentram ${fMoeda(orcAtr)}, ou ${fNum(100 * orcAtr / r.orc)}% do investimento da carteira.
      ${pior ? `O menor índice de desempenho é da Secretaria de ${pior.s.nome} (${pior.d.ids} pontos).` : ''}
    </p>
    <a href="#sala" class="btn-primary">${p1} prioridades P1 para decisão ${icone('seta', 'w-4 h-4')}</a>
  </section>`;
}

function listaDecisao(lista, tipo) {
  if (!lista.length) return '<p class="m-0 p-5 text-ink-3">Nenhum projeto nesta condição.</p>';
  return `<ul class="rows list-none m-0 p-0">${lista.slice(0, 5).map(p => `
    <li class="px-5 py-3 grid gap-x-4 gap-y-1 sm:grid-cols-[minmax(0,1fr)_auto] items-center">
      <div class="min-w-0">${linkProjeto(p)}<div class="text-[12px] text-ink-3">${secDe(p.sec).sigla} · ${esc(nomeGestor(p.gestor))} · ${fMoeda(p.orc)}</div></div>
      <div class="flex items-center gap-4 sm:justify-end">${badge(p.status)}${tipo === 'risco' ? risco(p.risco) : `<span class="text-[12px] text-ink-2 tabular-nums w-[104px]">${p.prazo < HOJE ? 'prazo vencido' : semAtualizacao(p) ? `${diasSemAtu(p)} dias sem dado` : `desvio ${fNum(desvio(p))} p.p.`}</span>`}</div>
    </li>`).join('')}</ul>`;
}

VIEWS.painel = () => {
  const r = resumoCarteira();
  const pct = n => `${fNum(100 * n / r.total)}% da carteira`;
  const porSec = SECRETARIAS.map(s => ({ s, l: PROJETOS.filter(p => p.sec === s.id) })).filter(x => x.l.length);
  const maxQ = Math.max(...porSec.map(x => x.l.length));
  const atencao = PROJETOS.filter(p => p.status === 'atr' || p.status === 'ate').sort((a, b) => prioridade(b) - prioridade(a));
  const arriscados = PROJETOS.filter(p => p.status !== 'con' && p.risco === 'Alto').sort((a, b) => b.orc - a.orc);

  return cabecalho('Dashboard Executivo', `Carteira de projetos estratégicos da gestão 2025–2028. Posição em ${fData(HOJE)}.`,
    `<a class="btn-secondary" href="#relatorios">${icone('relatorio')}Relatório da reunião</a>`)
  + sinteseExecutiva()
  + avisoDecisoesVencidas()
  + kpis([
    { rotulo: 'Total de projetos', valor: r.total, nota: `${SECRETARIAS.length} secretarias` },
    { rotulo: 'Em andamento', valor: r.por.and.length, nota: `${pct(r.por.and.length)} · mais ${r.por.ate.length} em atenção`, marca: STATUS.and.cor },
    { rotulo: 'Concluídos', valor: r.por.con.length, nota: pct(r.por.con.length), marca: STATUS.con.cor },
    { rotulo: 'Atrasados', valor: r.por.atr.length, nota: pct(r.por.atr.length), marca: STATUS.atr.cor },
    { rotulo: 'Total de investimentos', valor: `<span class="text-[24px]">R$ ${fNum(r.orc / 1e6, 1)} mi</span>`, nota: `${fMoeda(r.pago)} pagos (${fNum(100 * r.pago / r.orc)}%)` },
    { rotulo: 'Execução média', valor: `${fNum(r.execMedia)}%`, nota: `Ponderada por orçamento: ${fNum(r.execFisica)}%` }
  ])
  + `<div class="grid gap-4 mt-4 xl:grid-cols-[minmax(0,1.6fr)_minmax(0,1fr)] items-start">`
  + painel('Situação por Secretaria',
    tabela([
      { t: 'Secretaria', f: x => `<a class="link" href="#projetos" data-filtro-sec="${x.s.id}">${x.s.nome}</a>` },
      { t: 'Distribuição por situação', f: x => `<span class="block w-[180px] md:w-full md:min-w-[200px]">${barraSituacao(x.l, maxQ)}</span>` },
      { t: 'Projetos', num: true, f: x => x.l.length },
      { t: 'Investimento', num: true, f: x => fMoeda(soma(x.l, p => p.orc)) }
    ], porSec, { legenda: 'Quantidade de projetos por situação em cada secretaria' }),
    { pad: false, acao: legendaSituacao() })
  + painel('Ranking de Secretarias', `<ol class="rows list-none m-0 p-0">${ranking().map((x, i) => `
      <li class="flex items-center gap-3 px-5 py-[9px]">
        <span class="w-6 font-cond font-semibold text-[15px] text-ink-3 tabular-nums">${i + 1}º</span>
        <span class="flex-1 min-w-0"><span class="block font-medium">${x.s.nome}</span><span class="block text-[11.5px] text-ink-3">${x.d.lista.filter(p => p.status === 'atr').length} atrasado(s) em ${x.d.lista.length}</span></span>
        ${barra(x.d.ids, { rotulo: 'Índice de desempenho', cor: x.d.ids >= CONFIG.metaIDS ? 'bg-navy-700' : 'bg-st-atr', mostra: false, w: 'w-[64px]' })}
        <span class="w-[26px] text-right font-semibold tabular-nums">${x.d.ids}</span>
      </li>`).join('')}</ol>`,
    { sub: `Índice de Desempenho (IDS) · meta ${CONFIG.metaIDS}`, pad: false, rodape: 'IDS = 50% aderência física ao cronograma + 30% pontualidade + 20% atualização em dia. Em vermelho: abaixo da meta.' })
  + `</div><div class="grid gap-4 mt-4 xl:grid-cols-2 items-start">`
  + painel('Projetos com Atenção', listaDecisao(atencao, 'status'), { pad: false, sub: `${atencao.length} atrasados ou em atenção, por prioridade`, acao: '<a class="link text-[12.5px]" href="#sala">Ver todos</a>' })
  + painel('Projetos com Risco', listaDecisao(arriscados, 'risco'), { pad: false, sub: `${arriscados.length} com risco alto (${fMoeda(soma(arriscados, p => p.orc))})`, acao: '<a class="link text-[12.5px]" href="#riscos">Matriz de riscos</a>' })
  + `</div><div class="mt-4">`
  + painel('Últimas Atualizações', `<ol class="rows list-none m-0 p-0">${ultimasAtualizacoes(6).map(p => `
      <li class="grid gap-x-4 gap-y-0.5 px-5 py-3 md:grid-cols-[110px_minmax(0,1fr)_200px]">
        <time class="text-[12.5px] text-ink-3 tabular-nums" datetime="${isoDe(p.atualizado)}">${fData(p.atualizado)}</time>
        <div class="min-w-0">${linkProjeto(p, 'historico')}<div class="text-ink-2">${textoAtualizacao(p)}</div></div>
        <span class="text-[12.5px] text-ink-3 md:text-right">${esc(nomeGestor(p.gestor))} · ${secDe(p.sec).sigla}</span>
      </li>`).join('')}</ol>`, { pad: false })
  + '</div>';
};

/* ---------- Portfólio ---------- */
VIEWS.portfolio = () => {
  const eixos = EIXOS.map(e => ({ e, l: PROJETOS.filter(p => p.eixo === e) }));
  const ativos = PROJETOS.filter(p => p.status !== 'con');
  const dispersao = grafico((el, W) => {
    const H = Math.min(420, Math.max(280, W * .55)), e = 46, d = 16, t = 14, b = 40, iw = W - e - d, ih = H - t - b;
    const x = v => e + iw * v / 100, y = v => t + ih - ih * v / 100;
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
    [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${e}" x2="${W - d}" y1="${y(v)}" y2="${y(v)}" stroke="#E2EEF3"/><text x="${e - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text><text x="${x(v)}" y="${H - 22}" text-anchor="middle">${v}%</text>`; });
    let curva = ''; for (let i = 0; i <= 100; i += 4) curva += `${x(i)},${y(100 * curvaS(i / 100))} `;
    s += `<polyline points="${curva}" fill="none" stroke="#586373" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${e + iw / 2}" y="${H - 4}" text-anchor="middle">Prazo decorrido</text>`;
    s += `<text class="strong" x="${e + 8}" y="${t + 14}">Execução física</text><text x="${W - d - 4}" y="${y(44)}" text-anchor="end">Abaixo da curva: execução atrasada</text>`;
    ativos.forEach(p => {
      const px = 100 * clamp((HOJE - p.inicio) / (p.prazo - p.inicio)), r = 5 + Math.sqrt(p.orc / 1e6) * .8;
      s += `<a href="#projeto-${p.id}" aria-label="${esc(p.nome)}"><circle cx="${x(px)}" cy="${y(p.fisico)}" r="${r}" fill="${STATUS[p.status].cor}" stroke="#fff" stroke-width="2" ${dica(`${p.nome}\n${STATUS[p.status].rotulo} · ${fMoeda(p.orc)}\nFísico ${p.fisico}% · prazo decorrido ${fNum(px)}%`)}/></a>`;
    });
    el.innerHTML = s + '</svg>';
  }, 'Dispersão de execução física por prazo decorrido dos projetos não concluídos. Os mesmos dados estão na lista de projetos.');
  const maxOrc = Math.max(...eixos.map(x => soma(x.l, p => p.orc)));

  return cabecalho('Portfólio Estratégico', 'Distribuição do investimento por eixo do plano de governo e aderência ao cronograma.', '', [['Projetos', 'projetos'], ['Portfólio']])
    + painel('Investimento por Eixo Estratégico', tabela([

      { t: 'Situação', f: x => `<span class="block w-[170px]">${barraSituacao(x.l)}</span>` },

    ], eixos, { legenda: 'Investimento, quantidade e execução por eixo estratégico' }), { pad: false, acao: legendaSituacao() })
    + '<div class="mt-4">' + painel('Matriz de Aderência ao Cronograma', dispersao, { sub: 'Cada círculo é um projeto não concluído. A área acompanha o investimento. A linha tracejada é a curva S de referência.', acao: legendaSituacao() }) + '</div>';
};

const FILTRO_VAZIO = { q: '', sec: '', status: '', gestor: '', periodo: '', faixa: '', visao: 'todos' };
const GRADE = { ...FILTRO_VAZIO, ordem: 'prioridade', dir: -1, pagina: 1, porPagina: 10 };

const PERIODOS = {
  vencido: ['Prazo vencido', p => p.prazo < HOJE && p.status !== 'con'],
  '2026': ['Prazo em 2026', p => p.prazo.getFullYear() === 2026],
  '2027': ['Prazo em 2027', p => p.prazo.getFullYear() === 2027],
  '2028': ['Prazo em 2028', p => p.prazo.getFullYear() === 2028]
};
const FAIXAS = {
  a: ['Até R$ 5 mi', v => v <= 5e6], b: ['R$ 5 mi a R$ 20 mi', v => v > 5e6 && v <= 20e6],
  c: ['R$ 20 mi a R$ 50 mi', v => v > 20e6 && v <= 50e6], d: ['Acima de R$ 50 mi', v => v > 50e6]
};
const VISOES = {
  todos: ['Todos os projetos', () => true],
  atrasados: ['Atrasados', p => p.status === 'atr'],
  risco: ['Risco alto', p => p.risco === 'Alto' && p.status !== 'con'],
  semdado: ['Sem atualização', semAtualizacao]
};
const normal = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function filtrados() {
  const q = normal(GRADE.q.trim());
  return PROJETOS.filter(p =>
    VISOES[GRADE.visao][1](p)
    && (!q || normal(`${p.nome} ${p.codigo} ${nomeGestor(p.gestor)} ${secDe(p.sec).nome} ${secDe(p.sec).sigla}`).includes(q))
    && (!GRADE.sec || p.sec === GRADE.sec) && (!GRADE.status || p.status === GRADE.status)
    && (!GRADE.gestor || p.gestor === GRADE.gestor)
    && (!GRADE.periodo || PERIODOS[GRADE.periodo][1](p)) && (!GRADE.faixa || FAIXAS[GRADE.faixa][1](p.orc)));
}

const COLUNAS = [
  { k: 'nome', t: 'Projeto', v: p => p.nome, f: p => `<span class="block md:min-w-[210px]">${linkProjeto(p)}<span class="block text-[11.5px] text-ink-3 tabular-nums">${p.codigo}</span></span>` },
  { k: 'sec', t: 'Secretaria', v: p => secDe(p.sec).sigla, f: p => `<abbr class="no-underline" title="${secDe(p.sec).nome}">${secDe(p.sec).sigla}</abbr>` },
  { k: 'gestor', t: 'Gestor responsável', v: p => nomeGestor(p.gestor), f: p => esc(nomeGestor(p.gestor)) },
  { k: 'orc', t: 'Orçamento', num: true, v: p => p.orc, f: p => fMoeda(p.orc) },
  { k: 'pagP', t: 'Exec. financeira', v: p => p.pagP, f: p => barra(p.pagP, { rotulo: 'Execução financeira', cor: 'bg-[#3FA9CF]', w: 'w-[52px]' }) },
  { k: 'fisico', t: 'Exec. física', v: p => p.fisico, f: p => barra(p.fisico, { rotulo: 'Execução física', planejado: p.status === 'con' ? null : planejadoEm(p, HOJE), w: 'w-[52px]' }) },
  { k: 'status', t: 'Status', v: p => ORDEM_STATUS.indexOf(p.status), f: p => badge(p.status) },
  { k: 'risco', t: 'Grau de risco', v: p => ['Baixo', 'Médio', 'Alto'].indexOf(p.risco), f: p => risco(p.risco) },
  { k: 'atualizado', t: 'Última atualização', v: p => +p.atualizado, f: p => `<span class="whitespace-nowrap tabular-nums ${semAtualizacao(p) ? 'text-st-atr-tx font-semibold' : ''}">${fData(p.atualizado)}<span class="block text-[11.5px] ${semAtualizacao(p) ? '' : 'text-ink-3'}">${fHa(p.atualizado)}</span></span>` }
];

function corpoGrade() {
  const lista = filtrados();
  const col = COLUNAS.find(c => c.k === GRADE.ordem);
  const val = col ? col.v : prioridade;
  lista.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y, 'pt-BR') : x - y) * GRADE.dir; });
  const paginas = Math.max(1, Math.ceil(lista.length / GRADE.porPagina));
  GRADE.pagina = Math.min(GRADE.pagina, paginas);
  const ini = (GRADE.pagina - 1) * GRADE.porPagina, fatia = lista.slice(ini, ini + GRADE.porPagina);
  const r = resumoCarteira(lista);

  const tab = !fatia.length
    ? `<div class="px-5 py-12 text-center"><p class="m-0 font-semibold">Nenhum projeto atende aos filtros.</p><p class="m-0 mt-1 mb-3 text-ink-3">Remova um filtro ou altere o termo da busca.</p><button class="btn-secondary" data-acao="limpar">Limpar filtros</button></div>`
    : rolagem(`<table class="tbl tbl-stack"><caption class="sr-only">Projetos estratégicos. Os cabeçalhos ordenam a tabela.</caption>
      <thead><tr>${COLUNAS.map(c => `<th scope="col" ${GRADE.ordem === c.k ? `aria-sort="${GRADE.dir > 0 ? 'ascending' : 'descending'}"` : ''} class="${c.num ? '!text-right' : ''}"><button type="button" class="uppercase font-semibold tracking-[0.05em] text-inherit bg-transparent border-0 p-0 cursor-pointer hover:text-navy-900 ${c.num ? 'text-right' : 'text-left'}" data-ordem="${c.k}">${c.t}<span aria-hidden="true" class="ml-1">${GRADE.ordem === c.k ? (GRADE.dir > 0 ? '↑' : '↓') : ''}</span></button></th>`).join('')}</tr></thead>
      <tbody>${fatia.map(p => `<tr>${COLUNAS.map((c, i) => i === 0 ? `<th scope="row">${c.f(p)}</th>` : `<td data-l="${c.t}" class="${c.num ? 'num' : ''}">${c.f(p)}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">Totais do filtro: ${lista.length} projeto(s)</td><td class="num">${fMoeda(r.orc)}</td><td>${r.orc ? fNum(100 * r.pago / r.orc) : 0}% pago</td><td>${fNum(r.execFisica)}% físico</td><td></td><td></td><td></td></tr></tfoot></table>`, 'Tabela de projetos');

  const nums = Array.from({ length: paginas }, (_, i) => i + 1);
  const bt = (rot, pg, des, extra = '') => `<button type="button" class="btn-secondary !h-8 !px-2.5 min-w-8" data-pagina="${pg}" ${des ? 'disabled' : ''} ${extra}>${rot}</button>`;
  return tab + `<div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-line">
    <p class="m-0 text-[12.5px] text-ink-2" role="status">${lista.length ? `Exibindo ${ini + 1}–${ini + fatia.length} de ${lista.length}` : '0 resultados'}</p>
    <div class="flex flex-wrap items-center gap-4">
      <label class="flex items-center gap-2 text-[12.5px] text-ink-2">Linhas por página
        <select id="por-pagina" class="input !w-[72px] !h-8">${[10, 20, 50].map(n => `<option ${n === GRADE.porPagina ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <nav aria-label="Paginação" class="flex gap-1">
        ${bt('«', 1, GRADE.pagina === 1, 'aria-label="Primeira página"')}${bt('‹', GRADE.pagina - 1, GRADE.pagina === 1, 'aria-label="Página anterior"')}
        ${nums.map(n => `<button type="button" class="${n === GRADE.pagina ? 'btn-primary' : 'btn-secondary'} !h-8 !px-2.5 min-w-8" data-pagina="${n}" ${n === GRADE.pagina ? 'aria-current="page"' : ''}>${n}</button>`).join('')}
        ${bt('›', GRADE.pagina + 1, GRADE.pagina === paginas, 'aria-label="Próxima página"')}${bt('»', paginas, GRADE.pagina === paginas, 'aria-label="Última página"')}
      </nav>
    </div></div>`;
}

const opcoes = (pares, sel, vazio) => `<option value="">${vazio}</option>` + pares.map(([v, t]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');

function ligarGrade(raiz) {
  const redesenha = () => { raiz.querySelector('#grade').innerHTML = corpoGrade(); };
  raiz.addEventListener('input', e => { if (e.target.id === 'f-q') { GRADE.q = e.target.value; GRADE.pagina = 1; redesenha(); } });
  raiz.addEventListener('change', e => {
    if (e.target.dataset.filtro) { GRADE[e.target.dataset.filtro] = e.target.value; GRADE.pagina = 1; redesenha(); }
    if (e.target.id === 'por-pagina') { GRADE.porPagina = +e.target.value; GRADE.pagina = 1; redesenha(); raiz.querySelector('#por-pagina').focus(); }
  });
  raiz.addEventListener('click', e => {
    const o = e.target.closest('[data-ordem]'), pg = e.target.closest('[data-pagina]'), v = e.target.closest('[data-visao]'), a = e.target.closest('[data-acao]');
    if (o) { const k = o.dataset.ordem; GRADE.dir = GRADE.ordem === k ? -GRADE.dir : 1; GRADE.ordem = k; redesenha(); raiz.querySelector(`[data-ordem="${k}"]`)?.focus(); }
    if (pg) { GRADE.pagina = +pg.dataset.pagina; redesenha(); raiz.querySelector('[aria-current="page"][data-pagina]')?.focus(); }
    if (v) { GRADE.visao = v.dataset.visao; GRADE.pagina = 1; raiz.querySelectorAll('[data-visao]').forEach(b => b.setAttribute('aria-pressed', b === v)); redesenha(); }
    if (a?.dataset.acao === 'limpar') { Object.assign(GRADE, FILTRO_VAZIO, { pagina: 1 }); renderizar(); }
    if (a?.dataset.acao === 'exportar') {
      const linhas = [['Código', 'Projeto', 'Secretaria', 'Gestor', 'Orçamento', 'Exec. financeira %', 'Exec. física %', 'Status', 'Risco', 'Última atualização'],
        ...filtrados().map(p => [p.codigo, p.nome, secDe(p.sec).nome, nomeGestor(p.gestor), p.orc.toFixed(2).replace('.', ','), p.pagP, p.fisico, STATUS[p.status].rotulo, p.risco, fData(p.atualizado)])];
      /* neutraliza células que uma planilha interpretaria como fórmula */
      const cel = c => { const s = String(c).replace(/"/g, '""'); return `"${/^[=+\-@]/.test(s) ? "'" : ''}${s}"`; };
      copiar(linhas.map(l => l.map(cel).join(';')).join('\n'), `${linhas.length - 1} projeto(s) copiados em CSV. Cole na planilha.`);
    }
  });
}

  ${ajuda ? `<p class="field-help m-0">${ajuda}</p>` : ''}<p class="field-error m-0" id="${id}-erro" hidden></p></div>`;
const grupo = (titulo, desc, campos) => `<fieldset class="fieldset border-x-0 border-t-0 m-0 px-5"><legend class="sr-only">${titulo}</legend><div><h2 class="m-0 text-[14px] font-semibold text-navy-900" aria-hidden="true">${titulo}</h2><p class="m-0 mt-1 text-[12.5px] text-ink-3">${desc}</p></div><div class="grid gap-4 sm:grid-cols-2">${campos}</div></fieldset>`;

function validar(form, regras) {
  let primeiro = null;
  Object.entries(regras).forEach(([id, regra]) => {
    const el = form.querySelector('#' + id), erro = form.querySelector(`#${id}-erro`), msg = regra(el.value.trim());
    el.setAttribute('aria-invalid', msg ? 'true' : 'false');
    if (msg) { el.setAttribute('aria-describedby', `${id}-erro`); primeiro = primeiro || el; } else el.removeAttribute('aria-describedby');
    erro.textContent = msg || ''; erro.hidden = !msg;
  });
  if (primeiro) primeiro.focus();
  return !primeiro;
}
const obrigatorio = msg => v => v ? '' : msg;

function ligarNovoProjeto(raiz) {
  const f = raiz.querySelector('#form-projeto');
  f.querySelector('#np-sec').addEventListener('change', e => {
    const g = f.querySelector('#np-gestor'), l = GESTORES.filter(x => x.sec === e.target.value && x.status === 'Ativo');
    g.disabled = !l.length;
    g.innerHTML = opcoes(l.map(x => [x.id, x.nome]), '', l.length ? 'Selecione o gestor' : 'Nenhum gestor ativo nesta Secretaria');
  });
  const caixaEnv = f.querySelector('#np-envolvidas');
  f.querySelector('#np-add-env').addEventListener('click', () => {
    caixaEnv.insertAdjacentHTML('beforeend', linhaEnvolvidaNova());
    caixaEnv.lastElementChild.querySelector('select').focus();
  });
  caixaEnv.addEventListener('click', e => {
    if (!e.target.closest('[data-retirar-env]')) return;
    e.target.closest('[data-linha-env]').remove(); f.querySelector('#np-add-env').focus();
  });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = id => f.querySelector('#' + id).value.trim();
    const num = s => Number(s.replace(/\./g, '').replace(',', '.'));
    const ok = validar(f, {

    });
    if (!ok) return;
    const n = PROJETOS.length;
    const p = criarProjeto([v('np-nome'), v('np-sec'), v('np-gestor'), +v('np-eixo'), v('np-tipo'), num(v('np-orc')), v('np-ini'), v('np-fim'), 0, v('np-risco'), 0, v('np-obj')], n);
    Object.assign(p, { empP: 0, liqP: 0, pagP: 0, status: 'and' });

    aviso('Projeto cadastrado nesta demonstração. Ele some ao recarregar a página.');

}

const ABAS = [['visao', 'Visão Geral'], ['financeiro', 'Financeiro'], ['cronograma', 'Cronograma'], ['metas', 'Metas'], ['indicadores', 'Indicadores'], ['documentos', 'Documentos'], ['historico', 'Histórico']];

const ESTADO_MARCO = { feito: ['Concluído', 'con', '✓'], atrasado: ['Atrasado', 'atr', '■'], previsto: ['Previsto', 'neutro', '○'] };
const seloMarco = e => `<span class="badge-${ESTADO_MARCO[e][1]}"><span aria-hidden="true" class="text-[10px]">${ESTADO_MARCO[e][2]}</span>${ESTADO_MARCO[e][0]}</span>`;

function mesesDo(p) {
  const out = []; let d = new Date(p.inicio.getFullYear(), p.inicio.getMonth(), 1);
  const fim = new Date(Math.max(p.prazo, p.status === 'con' ? p.prazo : HOJE));
  while (d <= fim) { out.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  out.push(new Date(d));
  return out;
}
/* Curva acumulada planejada x realizada. atualPct = realizado hoje (ou no encerramento) */
function curvas(p, atualPct) {
  const ms = mesesDo(p);
  const corte = p.status === 'con' && p.prazo < HOJE ? p.prazo : HOJE;
  const hojeIdx = Math.max(0, ms.findIndex((m, i) => i === ms.length - 1 || ms[i + 1] > HOJE));
  const idxCorte = Math.max(1, ms.findIndex((m, i) => i === ms.length - 1 || ms[i + 1] > corte));
  const planCorte = Math.max(1, planejadoEm(p, corte));
  const plan = ms.map(m => +planejadoEm(p, m).toFixed(1));
  const real = ms.map((m, i) => i > idxCorte ? null : i === idxCorte ? atualPct : +Math.min(atualPct, planejadoEm(p, m) * atualPct / planCorte).toFixed(1));
  return { rotulos: ms.map(fMes), plan, real, hojeIdx: HOJE <= ms[ms.length - 1] ? hojeIdx : null };
}

function linhaDoTempo(p) {
  const ms = marcos(p), prox = ms.findIndex(m => m.estado !== 'feito');
  const decorrido = 100 * clamp((HOJE - p.inicio) / (p.prazo - p.inicio));
  return `<ol class="grid list-none m-0 p-0 lg:grid-flow-col lg:auto-cols-fr">${ms.map((m, i) => {
    const marca = m.estado === 'feito' ? 'bg-navy-800 border-navy-800 text-white' : m.estado === 'atrasado' ? 'bg-st-atr border-st-atr text-white' : 'bg-white border-line-control text-ink-3';
    return `<li class="relative flex gap-3 pb-4 lg:block lg:pb-0 lg:px-2 lg:text-center" ${i === prox ? 'aria-current="step"' : ''}>
      ${i < ms.length - 1 ? `<span aria-hidden="true" class="absolute left-[11px] top-6 bottom-0 w-[2px] lg:left-1/2 lg:top-[11px] lg:bottom-auto lg:w-full lg:h-[2px] ${m.estado === 'feito' && ms[i + 1].estado === 'feito' ? 'bg-navy-800' : 'bg-line-strong'}"></span>` : ''}
      <span aria-hidden="true" class="relative z-10 flex-none grid place-items-center w-6 h-6 rounded-full border-2 text-[11px] font-bold lg:mx-auto ${marca} ${i === prox ? 'ring-4 ring-navy-100' : ''}">${m.estado === 'feito' ? '✓' : i + 1}</span>
      <div class="min-w-0 lg:mt-2"><div class="text-[12px] leading-snug ${i === prox ? 'font-semibold text-navy-950' : 'text-ink-2'}">${m.nome}</div>
      <div class="text-[11.5px] tabular-nums ${m.estado === 'atrasado' ? 'text-st-atr-tx font-semibold' : 'text-ink-3'}">${fData(m.data)}<span class="sr-only">, ${ESTADO_MARCO[m.estado][0]}</span>${m.estado === 'atrasado' ? ' · atrasado' : ''}</div></div>
    </li>`;
  }).join('')}</ol>
  <div class="mt-4 pt-4 border-t border-line grid gap-2 text-[12.5px]">
    <div class="grid grid-cols-[130px_minmax(0,1fr)] items-center gap-3"><span class="text-ink-2">Prazo decorrido</span>${barra(decorrido, { rotulo: 'Prazo decorrido', cor: 'bg-ink-3', w: 'w-full' })}</div>
    <div class="grid grid-cols-[130px_minmax(0,1fr)] items-center gap-3"><span class="text-ink-2">Execução física</span>${barra(p.fisico, { rotulo: 'Execução física', w: 'w-full', planejado: p.status === 'con' ? null : planejadoEm(p, HOJE) })}</div>
  </div>`;
}

function situacaoGabinete(p) {
  if (p.status === 'con') return `<strong>Projeto concluído.</strong> Manter acompanhamento de encerramento, garantia contratual e prestação de contas.`;
  const partes = [];
  if (p.prazo < HOJE) partes.push(`o prazo venceu em ${fData(p.prazo)}`);
  if (desvio(p) >= 1) partes.push(`a execução física está ${fNum(desvio(p))} pontos abaixo do planejado para hoje`);
  if (semAtualizacao(p)) partes.push(`não há atualização há ${diasSemAtu(p)} dias`);
  return partes.length ? `<strong>${STATUS[p.status].rotulo}:</strong> ${partes.join(' e ')}.` : `<strong>Dentro do planejado.</strong> A execução física acompanha a curva de referência.`;
}

const abaVisao = p => {
  const c = curvas(p, p.fisico), f = curvas(p, p.pagP), rs = riscos(p), deps = dependencias(p), ms = marcos(p);
  const chave = [...ms.filter(m => m.estado === 'feito').slice(-2), ...ms.filter(m => m.estado !== 'feito').slice(0, 3)];
  const corLinha = [{ nome: 'Planejado', cor: '#586373', tracejado: true }, { nome: 'Realizado', cor: '#2A6FC0' }];
  return `<div class="grid gap-4">
  <div class="grid gap-4 xl:grid-cols-[minmax(0,1.5fr)_minmax(0,1fr)]">
    ${painel('Resumo Executivo', `<p class="m-0 text-[14.5px] leading-relaxed max-w-[72ch]">${esc(p.objetivo)}</p><p class="m-0 mt-3 text-ink-2">${situacaoGabinete(p)}</p><dl class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-4 mb-0 pt-4 border-t border-line">${[['Eixo estratégico', p.eixo], ['Código', p.codigo], ['Início', fData(p.inicio)]].map(([a, b]) => `<div><dt class="kpi-label">${a}</dt><dd class="m-0 mt-0.5">${b}</dd></div>`).join('')}</dl>`)}
    <section class="panel border-t-[3px] border-t-navy-800 bg-navy-50"><div class="p-5"><h2 class="panel-title">Encaminhamento ao Gabinete</h2><p class="m-0 mt-2 text-[15px] leading-relaxed font-medium text-navy-950">${p.status === 'con' ? 'Sem decisão pendente.' : encaminhamento(p)}</p>${prioridade(p) >= 40 ? `<p class="m-0 mt-3"><span class="badge-${nivelPrioridade(prioridade(p)) === 'P1' ? 'atr' : 'ate'}">Prioridade ${nivelPrioridade(prioridade(p))}</span></p>` : ''}${seloDecisoes(p)}${botaoDecidir(p)}</div></section>
  </div>
  ${painelDecisoes(p)}
  ${painelConversas(p)}
  <div class="grid gap-4 lg:grid-cols-2">
    ${painel('Progresso Físico', graficoLinhas({ ...c, series: [{ ...corLinha[0], valores: c.plan }, { ...corLinha[1], valores: c.real }], altura: 220, descricao: `Execução física realizada de ${p.fisico}% contra ${fNum(planejadoEm(p, HOJE))}% planejados` }), { sub: `Realizado ${p.fisico}% · planejado hoje ${fNum(planejadoEm(p, HOJE))}%` })}
    ${painel('Progresso Financeiro', graficoLinhas({ ...f, series: [{ ...corLinha[0], nome: 'Desembolso previsto', valores: f.plan }, { ...corLinha[1], nome: 'Pago', valores: f.real }], altura: 220, descricao: `Valor pago de ${p.pagP}% do previsto` }), { sub: `Pago ${fMoeda(valorDe(p, p.pagP))} de ${fMoeda(p.orc)}` })}
  </div>
  <div class="grid gap-4 xl:grid-cols-2">
    ${painel('Principais Marcos', `<ul class="rows list-none m-0 p-0">${chave.map(m => `<li class="flex flex-wrap items-center justify-between gap-2 px-5 py-2.5"><span class="min-w-0"><span class="block">${m.nome}</span><span class="text-[12px] text-ink-3 tabular-nums">Previsto para ${fData(m.data)}</span></span>${seloMarco(m.estado)}</li>`).join('')}</ul>`, { pad: false, acao: `<a class="link text-[12.5px]" href="#projeto-${p.id}-cronograma">Cronograma completo</a>` })}
    ${painel('Riscos Identificados', tabela([
      { t: 'Risco e resposta', f: r => `<span class="font-medium">${r[0]}</span><span class="block text-[12px] text-ink-3">${r[3]}</span>` },
      { t: 'P × I', num: true, f: r => `${r[1]} × ${r[2]}` },
      { t: 'Grau', f: r => risco(grauRisco(r[1] * r[2])) }
    ], rs, { legenda: 'Riscos do projeto', vazio: 'Projeto concluído, sem riscos abertos.' }), { pad: false })}
  </div>
  <div class="grid gap-4 xl:grid-cols-2">
    ${painel('Dependências', tabela([
      { t: 'Dependência', f: d => d[0] }, { t: 'Responsável externo', f: d => d[1] },
      { t: 'Data-limite', f: d => `<span class="tabular-nums">${fData(dISO(d[3]))}</span>` },
      { t: 'Situação', f: d => `<span class="badge-${{ 'Atendida': 'con', 'Pendente': 'ate', 'Em análise': 'and', 'Previsto': 'neutro' }[d[2]]}">${d[2]}</span>` }
    ], deps, { legenda: 'Dependências do projeto', vazio: 'Nenhuma dependência aberta.' }), { pad: false })}
    ${painel('Últimas Atualizações', `<ol class="rows list-none m-0 p-0">${historico(p).slice(0, 4).map(h => `<li class="px-5 py-2.5"><div class="text-[12px] text-ink-3 tabular-nums">${fData(h.data)} · ${esc(h.autor)}</div><div>${h.acao}</div></li>`).join('')}</ol>`, { pad: false, acao: `<a class="link text-[12.5px]" href="#projeto-${p.id}-historico">Histórico completo</a>` })}
  </div></div>`;
};
const grauRisco = n => n >= 15 ? 'Alto' : n >= 8 ? 'Médio' : 'Baixo';

const abaFinanceiro = p => {
  const vals = [['Valor Previsto', 100, '#8FD6EF'], ['Valor Empenhado', p.empP, '#3FA9CF'], ['Valor Liquidado', p.liqP, '#187598'], ['Valor Pago', p.pagP, '#093140']];
  const f = curvas(p, p.pagP);
  const fontes = [['Tesouro Municipal', .55], ['Convênio / transferência estadual', .30], ['Operação de crédito', .15]];
  return `<div class="grid gap-4">
  ${kpis(vals.map(([t, pct, cor]) => ({ rotulo: t, valor: `<span class="text-[25px]">${fMoeda(valorDe(p, pct))}</span>`, nota: t === 'Valor Previsto' ? 'Linha de base aprovada' : `${pct}% do previsto`, marca: cor })), 'grid-cols-1 sm:grid-cols-2 xl:grid-cols-4')}
  <div class="grid gap-4 xl:grid-cols-2">
    ${painel('Estágios da Despesa', graficoBarras({ itens: vals.map(([t, pct, cor]) => ({ nome: t.replace('Valor ', ''), valor: valorDe(p, pct), cor, extra: `${pct}% do previsto` })), max: p.orc, formato: fMoeda, descricao: 'Previsto, empenhado, liquidado e pago' }), { sub: 'Previsto → empenhado → liquidado → pago', rodape: `Saldo a empenhar: ${fMoeda(valorDe(p, 100 - p.empP))} · Liquidado a pagar: ${fMoeda(valorDe(p, p.liqP - p.pagP))}` })}
    ${painel('Execução Financeira Acumulada', graficoLinhas({ ...f, series: [{ nome: 'Desembolso previsto', cor: '#586373', tracejado: true, valores: f.plan.map(v => v * p.orc / 100) }, { nome: 'Pago', cor: '#2A6FC0', valores: f.real.map(v => v == null ? null : v * p.orc / 100) }], max: p.orc, formato: (v, eixo) => eixo ? fNum(v / 1e6, p.orc < 1e7 ? 1 : 0) + ' mi' : fMoeda(v), descricao: 'Pagamentos acumulados contra o desembolso previsto' }), { sub: 'Valores acumulados em reais' })}
  </div>
  ${painel('Composição por Fonte de Recurso', tabela([
    { t: 'Fonte', f: x => x[0] }, { t: 'Previsto', num: true, f: x => fMoeda(p.orc * x[1]) }, { t: 'Empenhado', num: true, f: x => fMoeda(valorDe(p, p.empP) * x[1]) },
    { t: 'Pago', num: true, f: x => fMoeda(valorDe(p, p.pagP) * x[1]) }, { t: 'Participação', num: true, f: x => fNum(x[1] * 100) + '%' }
  ], fontes, { legenda: 'Fontes de recurso do projeto' }), { pad: false })}
  </div>`;
};

const abaCronograma = p => {
  const ms = marcos(p);
  const hoje = 100 * (HOJE - p.inicio) / (p.prazo - p.inicio);
  const fases = ms.map((m, i) => ({ ...m, ini: i ? ms[i - 1].frac : 0 }));
  const gantt = `<div class="overflow-x-auto" role="region" aria-label="Linha do tempo por fase" tabindex="0"><div class="min-w-[620px] p-5">
    <div class="grid grid-cols-[230px_minmax(0,1fr)] gap-x-3 text-[11.5px] text-ink-3 tabular-nums mb-1"><span></span><span class="flex justify-between"><span>${fMes(p.inicio)}</span><span>${fMes(new Date((+p.inicio + +p.prazo) / 2))}</span><span>${fMes(p.prazo)}</span></span></div>
    ${fases.map(m => `<div class="grid grid-cols-[230px_minmax(0,1fr)] gap-x-3 items-center h-8 border-t border-line"><span class="truncate text-[12.5px]" title="${m.nome}">${m.nome}</span><span class="relative block h-full">
      <span class="absolute top-[9px] h-[14px] rounded-r-[4px] ${m.estado === 'feito' ? 'bg-navy-800' : m.estado === 'atrasado' ? 'bg-st-atr' : 'bg-[#C3E9F7]'}" style="left:${m.ini * 100}%;width:${(m.frac - m.ini) * 100}%" ${dica(`${m.nome}\n${fData(m.data)} · ${ESTADO_MARCO[m.estado][0]}`)}></span>
      ${hoje >= 0 && hoje <= 100 ? `<span aria-hidden="true" class="absolute inset-y-0 w-[2px] bg-ink" style="left:${hoje}%"></span>` : ''}</span></div>`).join('')}
    <ul class="flex flex-wrap gap-4 list-none m-0 mt-3 p-0 text-[12px] text-ink-2"><li><i class="inline-block w-3 h-3 bg-navy-800 mr-1.5"></i>Concluída</li><li><i class="inline-block w-3 h-3 bg-st-atr mr-1.5"></i>Atrasada</li><li><i class="inline-block w-3 h-3 bg-[#C3E9F7] mr-1.5"></i>Prevista</li><li><i class="inline-block w-[2px] h-3 bg-ink mr-1.5"></i>${hoje > 100 ? 'Hoje está além do prazo final' : 'Hoje'}</li></ul></div></div>`;
  const entregas = p.id === 'p01'
    ? [['36 leitos adicionais de urgência', 'Leitos', '2027-05-30'], ['Sala vermelha equipada', 'Ambiente', '2027-03-15'], ['Centro de diagnóstico por imagem', 'Ambiente', '2027-04-30'], ['Recepção com classificação de risco', 'Ambiente', '2026-12-20']]
    : [[p.tipo === 'obra' ? 'Projeto executivo e orçamento detalhado' : 'Documento de requisitos e plano de trabalho', 'Documento', isoDe(ms[0].data)], [p.tipo === 'obra' ? 'Obra física concluída' : p.tipo === 'tecnologia' ? 'Solução implantada em toda a rede' : 'Metas de cobertura implantadas', 'Entrega principal', isoDe(ms[ms.length - 2].data)], ['Relatório de encerramento e transferência para operação', 'Documento', isoDe(p.prazo)]];
  return `<div class="grid gap-4">${painel('Timeline por Fase', gantt, { pad: false })}
    <div class="grid gap-4 xl:grid-cols-2">
    ${painel('Marcos', tabela([{ t: 'Marco', f: m => m.nome }, { t: 'Data prevista', f: m => `<span class="tabular-nums">${fData(m.data)}</span>` }, { t: 'Situação', f: m => seloMarco(m.estado) }], ms, { legenda: 'Marcos do projeto' }), { pad: false })}
    ${painel('Entregas', tabela([{ t: 'Entrega', f: e => e[0] }, { t: 'Tipo', f: e => e[1] }, { t: 'Previsão', f: e => `<span class="tabular-nums">${fData(dISO(e[2]))}</span>` }, { t: 'Situação', f: e => seloMarco(p.fisico >= 100 || (e[2] < isoDe(HOJE) && e[1] === 'Documento' && p.fisico > 5) ? 'feito' : e[2] < isoDe(HOJE) ? 'atrasado' : 'previsto') }], entregas, { legenda: 'Entregas do projeto' }), { pad: false })}
    </div></div>`;
};

/* [meta, unidade, planejado até hoje, alcançado, meta final] */
function metas(p) {
  if (p.id === 'p01') return [['Área construída', 'm²', 3750, 2750, 4500], ['Leitos novos prontos para equipar', 'leitos', 24, 12, 36], ['Equipamentos adquiridos', 'itens', 140, 96, 212], ['Profissionais capacitados', 'pessoas', 60, 44, 180]];
  const pl = Math.round(planejadoEm(p, HOJE)), ms = marcos(p), prazoAteHoje = ms.filter(m => m.data <= HOJE).length;
  return [['Execução física', '%', p.status === 'con' ? 100 : pl, p.fisico, 100], ['Marcos concluídos', 'marcos', p.status === 'con' ? ms.length : prazoAteHoje, ms.filter(m => m.estado === 'feito').length, ms.length], ['Execução financeira (pago)', '%', p.status === 'con' ? 100 : Math.max(0, pl - 5), p.pagP, 100]];
}
const abaMetas = p => painel('Metas Planejadas e Alcançadas', tabela([
  { t: 'Meta', f: m => `<span class="font-medium">${m[0]}</span><span class="block text-[12px] text-ink-3">Unidade: ${m[1]}</span>` },
  { t: 'Planejado até hoje', num: true, f: m => fNum(m[2]) },
  { t: 'Alcançado', num: true, f: m => `<strong>${fNum(m[3])}</strong>` },
  { t: 'Meta final', num: true, f: m => fNum(m[4]) },
  { t: 'Avanço sobre a meta final', f: m => barra(100 * m[3] / m[4], { rotulo: 'Avanço', planejado: 100 * m[2] / m[4], w: 'w-[130px]' }) },
  { t: 'Atingimento no período', f: m => { const a = m[2] ? 100 * m[3] / m[2] : 100; return `<span class="badge-${a >= 95 ? 'con' : a >= 80 ? 'ate' : 'atr'}">${fNum(Math.min(999, a))}% do planejado</span>`; } }
], metas(p), { legenda: 'Metas planejadas e alcançadas' }), { pad: false, rodape: 'O traço vertical na barra indica o planejado até hoje. Verde: 95% ou mais. Amarelo: de 80% a 94%. Vermelho: abaixo de 80%.' });

const abaIndicadores = p => {
  const idp = p.status === 'con' ? 1 : p.fisico / Math.max(1, planejadoEm(p, HOJE));
  const ms = marcos(p), devidos = ms.filter(m => m.data <= HOJE);
  const noPrazo = devidos.length ? 100 * devidos.filter(m => m.estado === 'feito').length / devidos.length : 100;
  const serie = (fim, passo) => [5, 4, 3, 2, 1, 0].map(k => +(fim + k * passo + [0, .6, -.4, .5, -.2, 0][k] * Math.abs(passo)).toFixed(2));
  const meses = Math.max(1, (Math.min(HOJE, p.prazo) - p.inicio) / (DIA * 30.4));
  const k = [
    ['IDP · Índice de Desempenho de Prazo', 'Físico realizado ÷ físico planejado', fNum(idp, 2), '≥ 0,95', idp >= .95, serie(idp, idp < .95 ? .025 : -.008)],
    ['Marcos cumpridos', 'Marcos concluídos entre os já vencidos', fNum(noPrazo) + '%', '≥ 90%', noPrazo >= 90, serie(noPrazo, noPrazo < 90 ? 2 : -1)],
    ['Avanço físico médio mensal', 'Pontos percentuais por mês', fNum(p.fisico / meses, 1) + ' p.p.', 'Referência: ' + fNum(100 / ((p.prazo - p.inicio) / (DIA * 30.4)), 1), p.status === 'con' || idp >= .95, serie(p.fisico / meses, .12)],
    ['Aderência físico-financeira', 'Diferença entre liquidado e físico', fNum(p.liqP - p.fisico) + ' p.p.', 'Entre −8 e +3', p.liqP - p.fisico >= -8 && p.liqP - p.fisico <= 3, serie(p.liqP - p.fisico, .5)],
    ['Dias desde a última atualização', 'Tempestividade do registro', diasSemAtu(p), `≤ ${CONFIG.diasSemAtualizacao} dias`, !semAtualizacao(p), [9, 14, 7, 12, 8, diasSemAtu(p)]],
    ['Percentual geral', '60% físico + 25% financeiro + 15% marcos', percentualGeral(p) + '%', 'Acompanhar tendência', null, serie(percentualGeral(p), -3.5).map(v => Math.max(0, v))]
  ];
  return painel('KPIs do Projeto', tabela([
    { t: 'Indicador', f: x => `<span class="font-semibold">${x[0]}</span><span class="block text-[12px] text-ink-3">${x[1]}</span>` },
    { t: 'Valor atual', num: true, f: x => `<span class="font-cond text-[19px] font-semibold text-navy-950">${x[2]}</span>` },
    { t: 'Meta', f: x => x[3] },
    { t: 'Últimos 6 meses', f: x => minigrafico(x[5], `Tendência de ${x[0]}: de ${fNum(x[5][0], 1)} para ${fNum(x[5][5], 1)}`) },
    { t: 'Avaliação', f: x => x[4] === null ? '<span class="badge-neutro">Informativo</span>' : x[4] ? '<span class="badge-con">✓ Na meta</span>' : '<span class="badge-ate">▲ Fora da meta</span>' }
  ], k, { legenda: 'Indicadores de desempenho do projeto' }), { pad: false });
};

function documentos(p) {
  const n = p.codigo.slice(-3);
  const base = [
    ['Projetos', p.tipo === 'obra' ? 'Projeto básico e executivo' : 'Termo de referência', `PRJ-${n}/01`, p.inicio, 'Vigente'],
    ['Projetos', 'Termo de abertura do projeto', `TAP-${n}`, p.inicio, 'Vigente'],

/* ---------- Regras ---------- */
const envolvidasDe = p => p.envolvidas || (p.envolvidas = []);
const etapasDe = p => p.etapas || (p.etapas = []);
const etapaDe = (p, id) => etapasDe(p).find(e => e.id === id);
const predecessoras = (p, e) => e.depende.map(id => etapaDe(p, id)).filter(Boolean);
const pendentesDe = (p, e) => predecessoras(p, e).filter(x => !x.concluida);
const etapaVencida = e => !e.concluida && e.fim < HOJE;

/* "Aguardando" = está de fato retida: já deveria ter começado ou uma anterior venceu */
function estadoEtapa(p, e) {
  if (e.concluida) return 'con';
  const pend = pendentesDe(p, e);
  if (pend.length) return e.inicio <= HOJE || pend.some(etapaVencida) ? 'agu' : 'pre';
  if (e.fim < HOJE) return 'atr';
  return e.inicio <= HOJE ? 'and' : 'pre';
}
/* todas as etapas que dependem desta, direta ou indiretamente */
function dependentesDe(p, id) {
  const vistas = new Set();
  const visitar = x => etapasDe(p).forEach(e => { if (e.depende.includes(x) && !vistas.has(e.id)) { vistas.add(e.id); visitar(e.id); } });
  visitar(id);
  return etapasDe(p).filter(e => vistas.has(e.id));
}
function criaCiclo(p, id, depende) {
  if (!id) return false; /* etapa nova: ninguém depende dela ainda */
  const proibidas = new Set([id, ...dependentesDe(p, id).map(e => e.id)]);
  return depende.some(d => proibidas.has(d));
}
/* ordem de execução: etapas com o mesmo número podem ocorrer ao mesmo tempo */
function ordemEtapa(p, e, memo = new Map()) {
  if (memo.has(e.id)) return memo.get(e.id);
  memo.set(e.id, 1);
  const n = 1 + Math.max(0, ...predecessoras(p, e).map(x => ordemEtapa(p, x, memo)));
  memo.set(e.id, n);
  return n;
}
const emOrdem = p => [...etapasDe(p)].sort((a, b) => ordemEtapa(p, a) - ordemEtapa(p, b) || a.inicio - b.inicio);
const numeroEtapa = (p, e) => emOrdem(p).indexOf(e) + 1;
const numerosDe = (p, lista) => lista.map(x => numeroEtapa(p, x)).sort((a, b) => a - b).join(', ');

/* Término mais cedo possível: pendências vencidas concluídas hoje e durações mantidas */
function terminoDaEtapa(p, e) {
  if (e.concluida) return e.concluida;
  const pend = pendentesDe(p, e);
  let fim = Math.max(+e.fim, +HOJE);
  if (pend.length) fim = Math.max(fim, Math.max(...pend.map(x => +terminoDaEtapa(p, x))) + (e.fim - e.inicio));
  return new Date(fim);
}
const terminoMinimo = p => etapasDe(p).length ? new Date(Math.max(...etapasDe(p).map(e => +terminoDaEtapa(p, e)))) : null;
function textoProjecao(p) {
  const t = terminoMinimo(p);
  if (!t) return '';
  const alem = diasEntre(p.prazo, t);
  return alem > 0 ? `Pelas etapas, o término mais cedo possível é ${fData(t)}: ${alem} dia(s) depois do prazo do projeto.` : 'Pelas datas das etapas, o prazo do projeto ainda pode ser cumprido.';
}

const bloqueiosDoProjeto = p => emOrdem(p).filter(e => estadoEtapa(p, e) === 'agu').flatMap(e => pendentesDe(p, e).map(causa => ({ p, etapa: e, causa })));
const bloqueios = () => PROJETOS.flatMap(bloqueiosDoProjeto).sort((a, b) => a.causa.fim - b.causa.fim);
const siglaSec = id => secDe(id).sigla;
const situacaoCausa = (p, c) => etapaVencida(c) ? `vencida há ${diasEntre(c.fim, HOJE)} dias` : `prazo em ${fData(c.fim)}`;
const fraseBloqueio = b => `<strong>${siglaSec(b.etapa.sec)}</strong> aguarda <strong>${siglaSec(b.causa.sec)}</strong>: “${esc(b.causa.nome)}” (${situacaoCausa(b.p, b.causa)}).`;

function avisoBloqueio(p, comLink = true) {
  const l = bloqueiosDoProjeto(p);
  if (!l.length) return '';
  const afetadas = new Set(l.flatMap(b => [b.etapa, ...dependentesDe(p, b.etapa.id)]));
  return `<section class="panel border-l-[4px] border-l-st-ate mb-4" aria-label="Etapas retidas"><div class="px-5 py-3">
    <h2 class="panel-title">Quem está esperando por quem</h2>
    <ul class="m-0 mt-1.5 pl-5 grid gap-1">${l.map(b => `<li>${fraseBloqueio(b)}</li>`).join('')}</ul>
    <p class="m-0 mt-1.5 text-ink-2">${afetadas.size} etapa(s) afetada(s). ${textoProjecao(p)}</p>
    ${comLink ? `<p class="m-0 mt-1.5"><a class="link" href="#projeto-${p.id}-secretarias" data-abrir-aba="secretarias">Ver Secretarias e Etapas</a></p>` : ''}
  </div></section>`;
}

/* ---------- Aba "Secretarias e Etapas" ---------- */
const EDICAO = { projeto: '', tipo: '', id: '', confirmar: '' };
const abrirEdicao = (p, tipo = '', id = '') => Object.assign(EDICAO, { projeto: p.id, tipo, id, confirmar: '' });

function fluxoEtapas(p) {
  const l = emOrdem(p);
  if (!l.length) return '';
  const niveis = [...new Set(l.map(e => ordemEtapa(p, e)))];
  return `<ol class="grid gap-3 list-none m-0 p-5 lg:grid-flow-col lg:auto-cols-[minmax(200px,1fr)]">${niveis.map(n => {

    return `<li class="min-w-0"><h3 class="m-0 pb-1.5 mb-2 border-b-2 border-navy-800 text-[12px] font-semibold uppercase tracking-[0.06em] text-navy-900">${n}ª ordem${doNivel.length > 1 ? '<span class="block normal-case tracking-normal font-normal text-ink-3">podem ocorrer juntas</span>' : ''}</h3>
      <ul class="grid gap-2 list-none m-0 p-0">${doNivel.map(e => {
        const k = estadoEtapa(p, e), pre = predecessoras(p, e);
        return `<li class="border ${k === 'atr' ? 'border-st-atr border-2' : k === 'agu' ? 'border-st-ate border-2' : 'border-line-strong'} rounded-[3px] p-3 bg-white">
          <div class="text-[11.5px] font-semibold text-ink-3">Etapa ${numeroEtapa(p, e)} · ${siglaSec(e.sec)}</div>
          <div class="font-medium leading-snug mb-1.5">${esc(e.nome)}</div>${seloEtapa(k)}
          <div class="mt-1.5 text-[12px] text-ink-3">${pre.length ? `Depende da(s) etapa(s) ${numerosDe(p, pre)}` : 'Não depende de outra etapa'}</div></li>`;
      }).join('')}</ul></li>`;
  }).join('')}</ol>`;
}

function formEtapa(p) {
  const atual = EDICAO.id ? etapaDe(p, EDICAO.id) : null;
  const e = atual || { nome: '', sec: '', inicio: null, fim: null, depende: [] };
  const responsaveis = [p.sec, ...envolvidasDe(p).filter(x => x.papel !== 'apoio').map(x => x.sec)];
  const candidatas = emOrdem(p).filter(x => !atual || !criaCiclo(p, atual.id, [x.id]));
  return `<form id="form-etapa" novalidate class="grid gap-4 sm:grid-cols-2 p-5 border-t border-line bg-subtle" aria-label="${atual ? 'Editar etapa' : 'Nova etapa'}">
    <h3 class="m-0 text-[14px] font-semibold text-navy-900 sm:col-span-2">${atual ? `Editar etapa ${numeroEtapa(p, atual)}` : 'Nova etapa'}</h3>
    ${campo('et-nome', 'O que será entregue', `<input id="et-nome" class="input" maxlength="100" value="${esc(e.nome)}">`, { obrig: true, cls: 'sm:col-span-2' })}
    ${campo('et-sec', 'Secretaria responsável', `<select id="et-sec" class="input">${opcoes(responsaveis.map(s => [s, secDe(s).nome]), e.sec, 'Selecione')}</select>`, { obrig: true, cls: 'sm:col-span-2', ajuda: 'Aparecem a coordenadora, as executoras e as de parecer. Para incluir outra, cadastre-a em Secretarias Envolvidas.' })}
    ${campo('et-ini', 'Início previsto', `<input id="et-ini" type="date" class="input" value="${e.inicio ? isoDe(e.inicio) : ''}">`, { obrig: true })}
    ${campo('et-fim', 'Fim previsto', `<input id="et-fim" type="date" class="input" value="${e.fim ? isoDe(e.fim) : ''}">`, { obrig: true })}
    <fieldset class="sm:col-span-2 m-0 p-0 border-0"><legend class="field-label">Depende de (a etapa só começa depois destas)</legend>
      ${candidatas.length ? `<div class="grid gap-1.5">${candidatas.map(x => `<label class="flex gap-2 items-start cursor-pointer"><input type="checkbox" name="et-dep" value="${x.id}" class="mt-1 accent-[#146484]" ${e.depende.includes(x.id) ? 'checked' : ''}><span>Etapa ${numeroEtapa(p, x)}: ${esc(x.nome)} <span class="text-ink-3">(${siglaSec(x.sec)})</span></span></label>`).join('')}</div>` : '<p class="m-0 text-ink-3">Não há outra etapa que possa ser escolhida.</p>'}
      ${atual && dependentesDe(p, atual.id).length ? `<p class="field-help m-0">Não aparecem as etapas ${numerosDe(p, dependentesDe(p, atual.id))}: elas já dependem desta, e escolhê-las criaria um ciclo.</p>` : ''}
      <p class="field-error m-0" id="et-dep-erro" role="alert" hidden></p></fieldset>
    ${rodapeForm(atual ? 'Salvar etapa' : 'Adicionar etapa')}
  </form>`;
}

function formEnvolvida(p) {
  const atual = EDICAO.id ? envolvidasDe(p).find(x => x.sec === EDICAO.id) : null;
  const x = atual || { sec: '', papel: '', atribuicao: '', contato: '', aporte: 0 };
  const livres = SECRETARIAS.filter(s => s.id !== p.sec && (s.id === x.sec || !envolvidasDe(p).some(v => v.sec === s.id)));
  return `<form id="form-envolvida" novalidate class="grid gap-4 sm:grid-cols-2 p-5 border-t border-line bg-subtle" aria-label="${atual ? 'Editar Secretaria envolvida' : 'Incluir Secretaria'}">
    <h3 class="m-0 text-[14px] font-semibold text-navy-900 sm:col-span-2">${atual ? 'Editar Secretaria envolvida' : 'Incluir Secretaria'}</h3>
    ${campo('ev-sec', 'Secretaria', `<select id="ev-sec" class="input" ${atual ? 'disabled' : ''}>${opcoes(livres.map(s => [s.id, s.nome]), x.sec, 'Selecione')}</select>`, { obrig: true })}
    ${campo('ev-papel', 'Papel no projeto', `<select id="ev-papel" class="input">${opcoes(Object.entries(PAPEIS), x.papel, 'Selecione')}</select>`, { obrig: true })}
    ${campo('ev-atr', 'O que deve fazer', `<textarea id="ev-atr" rows="2" class="input" maxlength="200">${esc(x.atribuicao)}</textarea>`, { obrig: true, cls: 'sm:col-span-2' })}
    ${campo('ev-contato', 'Pessoa de contato', `<input id="ev-contato" class="input" maxlength="80" value="${esc(x.contato)}">`, { obrig: true })}
    ${campo('ev-aporte', 'Aporte desta Secretaria (R$ milhões)', `<input id="ev-aporte" class="input tabular-nums" inputmode="decimal" value="${x.aporte ? fNum(x.aporte / 1e6, 1) : ''}">`, { ajuda: 'Opcional. Informa o rateio e não muda o investimento total.' })}
    ${rodapeForm(atual ? 'Salvar Secretaria' : 'Incluir Secretaria')}
  </form>`;
}

function abaSecretarias(p) {
  if (EDICAO.projeto !== p.id) abrirEdicao(p);
  const etapas = emOrdem(p), env = envolvidasDe(p);
  const linhas = [{ sec: p.sec, coord: true, atribuicao: 'Responde pelo resultado, acompanha todas as etapas e leva os impasses ao Gabinete.', contato: nomeGestor(p.gestor) }, ...env];
  const rateio = soma(env, x => x.aporte || 0);
  const tabEnv = tabela([
    { t: 'Secretaria', f: x => `<span class="font-semibold">${secDe(x.sec).nome}</span><span class="block text-[12px] text-ink-3">${siglaSec(x.sec)}</span>` },
    { t: 'Papel', f: x => x.coord ? '<span class="badge-and">Coordenadora</span>' : `<span class="badge-neutro">${PAPEIS[x.papel]}</span>` },
    { t: 'O que deve fazer', f: x => `<span class="block max-w-[46ch]">${esc(x.atribuicao)}</span>` },
    { t: 'Contato', f: x => esc(x.contato) },
    { t: 'Etapas', num: true, f: x => etapas.filter(e => e.sec === x.sec).length },
    { t: 'Aporte', num: true, f: x => x.coord ? '—' : x.aporte ? fMoeda(x.aporte) : '—' },
    { t: 'Ações', f: x => {
      if (x.coord) return '<span class="text-ink-3 text-[12px]">Definida no cadastro</span>';
      const presa = etapas.some(e => e.sec === x.sec) ? 'Reatribua ou remova antes as etapas desta Secretaria' : '';
      return `<span class="inline-flex flex-wrap justify-end gap-1">${botaoLinha('editar-env', x.sec, 'Editar', secDe(x.sec).nome)}${botaoLinha('remover-env', x.sec, EDICAO.confirmar === 'env-' + x.sec ? 'Confirmar remoção' : 'Remover', secDe(x.sec).nome, presa)}</span>${presa ? '<span class="block text-[11.5px] text-ink-3">Tem etapas: não pode ser removida</span>' : ''}`;
    } }
  ], linhas, { legenda: 'Secretarias envolvidas no projeto' });

  const tabEtapas = tabela([
    { t: 'Etapa', f: e => `<span class="font-semibold">${numeroEtapa(p, e)}. ${esc(e.nome)}</span><span class="block text-[12px] text-ink-3">${ordemEtapa(p, e)}ª ordem de execução</span>` },
    { t: 'Responsável', f: e => `<abbr class="no-underline" title="${secDe(e.sec).nome}">${siglaSec(e.sec)}</abbr>` },
    { t: 'Período', f: e => `<span class="tabular-nums">${fData(e.inicio)} a ${fData(e.fim)}</span>${e.concluida ? `<span class="block text-[12px] text-ink-3">concluída em ${fData(e.concluida)}</span>` : ''}` },
    { t: 'Depende de', f: e => {
      const pre = predecessoras(p, e), cedo = pre.filter(x => !x.concluida && e.inicio < x.fim);
      return `${pre.length ? 'Etapa(s) ' + numerosDe(p, pre) : 'Nenhuma'}${cedo.length ? `<span class="block text-[12px] text-st-ate-tx">Início anterior ao fim da(s) etapa(s) ${numerosDe(p, cedo)}</span>` : ''}`;
    } },
    { t: 'Situação', f: e => { const k = estadoEtapa(p, e); return seloEtapa(k) + (k === 'agu' && etapaVencida(e) ? '<span class="block text-[12px] text-st-atr-tx">prazo da etapa vencido</span>' : ''); } },
    { t: 'Ações', f: e => {
      const pend = pendentesDe(p, e), posteriores = dependentesDe(p, e.id), diretas = posteriores.filter(x => x.depende.includes(e.id));
      const concluir = e.concluida
        ? botaoLinha('reabrir', e.id, 'Reabrir', e.nome, posteriores.some(x => x.concluida) ? 'Reabra antes as etapas posteriores já concluídas' : '')
        : botaoLinha('concluir', e.id, 'Concluir', e.nome, pend.length ? `Conclua antes a(s) etapa(s) ${numerosDe(p, pend)}` : '');
      return `<span class="inline-flex flex-wrap justify-end gap-1">${concluir}${botaoLinha('editar-etapa', e.id, 'Editar', e.nome)}${botaoLinha('remover-etapa', e.id, EDICAO.confirmar === e.id ? 'Confirmar remoção' : 'Remover', e.nome, diretas.length ? `Retire antes a dependência na(s) etapa(s) ${numerosDe(p, diretas)}` : '')}</span>`;
    } }
  ], etapas, { legenda: 'Etapas e dependências', vazio: 'Nenhuma etapa cadastrada. Em projetos de uma única Secretaria, as etapas são opcionais.' });

  const acao = (a, t) => `<button type="button" class="btn-secondary !h-8" data-coop="${a}" data-oculta-apresentacao>${icone('novo')}${t}</button>`;
  return `${avisoBloqueio(p, false)}<div class="grid gap-4">
    ${etapas.length ? painel('Fluxo de Execução', fluxoEtapas(p), { pad: false, sub: 'Etapas agrupadas por ordem de execução. As de mesma ordem não dependem uma da outra.', rodape: textoProjecao(p) + ' Estimativa que supõe concluir hoje o que está vencido e manter as durações.' }) : ''}
    ${painel('Etapas e Dependências', tabEtapas + (EDICAO.tipo === 'etapa' ? formEtapa(p) : ''), { pad: false, acao: acao('nova-etapa', 'Adicionar etapa'), rodape: 'Um botão apagado indica uma dependência a resolver antes. As etapas não alteram a execução física, a situação do projeto nem o IDS. Outras dependências, como concessionárias e Câmara Municipal, continuam na aba Visão Geral.' })}
    ${painel('Secretarias Envolvidas', tabEnv + (EDICAO.tipo === 'env' ? formEnvolvida(p) : ''), { pad: false, acao: acao('nova-env', 'Incluir Secretaria'), sub: `${linhas.length} Secretaria(s). Somente uma coordena.`, rodape: `Investimento de ${fMoeda(p.orc)} contado uma única vez, na coordenadora.${rateio ? ` Rateio informado pelas envolvidas: ${fMoeda(rateio)}.` : ''}` })}
  </div>`;
}
ABAS.splice(1, 0, ['secretarias', 'Secretarias e Etapas']);
CONTEUDO_ABA.secretarias = abaSecretarias;
CONTEUDO_ABA.visao = p => avisoBloqueio(p) + abaVisao(p);

const registrar = (p, categoria, acao) => (p.registros || (p.registros = [])).push({ data: HOJE, categoria, acao, autor: 'Usuário da demonstração' });
const lerValor = s => Number(s.replace(/\./g, '').replace(',', '.'));

function ligarEtapas(raiz) {
  const area = () => raiz.querySelector('#painel-aba');
  const projeto = () => projDe(area().dataset.projeto);
  const redesenhar = foco => {
    area().innerHTML = abaSecretarias(projeto());
    const alvo = foco && area().querySelector(foco);
    if (alvo) alvo.focus();
  };
  raiz.addEventListener('click', ev => {
    const b = ev.target.closest('[data-coop]'); if (!b) return;
    const p = projeto(), a = b.dataset.coop, id = b.dataset.id;
    if (a === 'cancelar') { abrirEdicao(p); return redesenhar('[data-coop="nova-etapa"]'); }
    if (a === 'nova-etapa') { abrirEdicao(p, 'etapa'); return redesenhar('#et-nome'); }
    if (a === 'editar-etapa') { abrirEdicao(p, 'etapa', id); return redesenhar('#et-nome'); }
    if (a === 'nova-env') { abrirEdicao(p, 'env'); return redesenhar('#ev-sec'); }
    if (a === 'editar-env') { abrirEdicao(p, 'env', id); return redesenhar('#ev-papel'); }
    if (a === 'concluir' || a === 'reabrir') {
      const e = etapaDe(p, id);
      if (a === 'concluir' && pendentesDe(p, e).length) return;
      if (a === 'reabrir' && dependentesDe(p, id).some(x => x.concluida)) return;
      e.concluida = a === 'concluir' ? HOJE : null;
      registrar(p, 'Etapa', `${a === 'concluir' ? 'Etapa concluída' : 'Etapa reaberta'}: ${esc(e.nome)} (${siglaSec(e.sec)}).`);
      abrirEdicao(p); redesenhar(`[data-id="${id}"][data-coop="${a === 'concluir' ? 'reabrir' : 'concluir'}"]`);
      return aviso(a === 'concluir' ? 'Etapa concluída nesta demonstração.' : 'Etapa reaberta nesta demonstração.');
    }
    /* remoção em dois cliques, sem caixa de diálogo do navegador */
    const chave = a === 'remover-env' ? 'env-' + id : id;
    if (EDICAO.confirmar !== chave) { EDICAO.confirmar = chave; return redesenhar(`[data-id="${id}"][data-coop="${a}"]`); }
    if (a === 'remover-etapa') {
      const e = etapaDe(p, id);
      if (etapasDe(p).some(x => x.depende.includes(id))) return;
      p.etapas = etapasDe(p).filter(x => x !== e);
      registrar(p, 'Etapa', `Etapa removida: ${esc(e.nome)}.`);
    }
    if (a === 'remover-env') {
      if (etapasDe(p).some(e => e.sec === id)) return;
      p.envolvidas = envolvidasDe(p).filter(x => x.sec !== id);
      registrar(p, 'Secretaria', `Secretaria retirada do projeto: ${secDe(id).nome}.`);
    }
    abrirEdicao(p); redesenhar(a === 'remover-env' ? '[data-coop="nova-env"]' : '[data-coop="nova-etapa"]');
  });

  raiz.addEventListener('submit', ev => {
    const f = ev.target; if (f.id !== 'form-etapa' && f.id !== 'form-envolvida') return;
    ev.preventDefault();
    const p = projeto(), v = i => f.querySelector('#' + i).value.trim();
    if (f.id === 'form-etapa') {
      const camposOk = validar(f, {
        'et-nome': obrigatorio('Descreva a entrega da etapa.'), 'et-sec': obrigatorio('Selecione a Secretaria responsável.'),
        'et-ini': obrigatorio('Informe o início previsto.'), 'et-fim': x => !x ? 'Informe o fim previsto.' : x < v('et-ini') ? 'O fim não pode ser anterior ao início.' : ''
      });
      const depende = [...f.querySelectorAll('[name="et-dep"]:checked')].map(c => c.value);
      const atual = EDICAO.id ? etapaDe(p, EDICAO.id) : null;
      const erroDep = criaCiclo(p, atual?.id, depende) ? 'Essa escolha cria um ciclo: uma etapa passaria a depender dela mesma.'
        : atual?.concluida && depende.some(d => !etapaDe(p, d).concluida) ? 'Esta etapa está concluída e não pode depender de uma etapa em aberto. Reabra-a antes.' : '';
      const caixa = f.querySelector('#et-dep-erro'); caixa.textContent = erroDep; caixa.hidden = !erroDep;
      if (!camposOk || erroDep) return;
      const dados = { nome: v('et-nome'), sec: v('et-sec'), inicio: dISO(v('et-ini')), fim: dISO(v('et-fim')), depende };
      if (atual) Object.assign(atual, dados);
      else p.etapas = [...etapasDe(p), { id: 'e' + (1 + Math.max(0, ...etapasDe(p).map(e => +e.id.slice(1)))), concluida: null, ...dados }];
      registrar(p, 'Etapa', `${atual ? 'Etapa alterada' : 'Etapa incluída'}: ${esc(dados.nome)} (${siglaSec(dados.sec)}).`);
    } else {
      const atual = EDICAO.id ? envolvidasDe(p).find(x => x.sec === EDICAO.id) : null;
      const outros = soma(envolvidasDe(p).filter(x => x !== atual), x => x.aporte || 0);
      const ok = validar(f, {
        'ev-sec': obrigatorio('Selecione a Secretaria.'),
        'ev-papel': x => !x ? 'Selecione o papel.' : x === 'apoio' && atual && etapasDe(p).some(e => e.sec === atual.sec) ? 'Esta Secretaria tem etapas. Reatribua-as antes de mudar para Apoio.' : '',
        'ev-atr': obrigatorio('Descreva o que a Secretaria deve fazer.'), 'ev-contato': obrigatorio('Informe a pessoa de contato.'),
        'ev-aporte': x => !x ? '' : !(lerValor(x) >= 0) ? 'Informe um valor como 2,5.' : outros + lerValor(x) * 1e6 > p.orc + 1 ? `A soma dos aportes passa do investimento total (${fMoeda(p.orc)}).` : ''
      });
      if (!ok) return;
      const dados = { sec: v('ev-sec'), papel: v('ev-papel'), atribuicao: v('ev-atr'), contato: v('ev-contato'), aporte: v('ev-aporte') ? lerValor(v('ev-aporte')) * 1e6 : 0 };
      if (atual) Object.assign(atual, dados); else p.envolvidas = [...envolvidasDe(p), dados];
      registrar(p, 'Secretaria', `${atual ? 'Participação alterada' : 'Secretaria incluída no projeto'}: ${secDe(dados.sec).nome} (${PAPEIS[dados.papel]}).`);
    }
    const foiEtapa = f.id === 'form-etapa';
    abrirEdicao(p); redesenhar(foiEtapa ? '[data-coop="nova-etapa"]' : '[data-coop="nova-env"]');
    aviso('Salvo nesta demonstração. A alteração some ao recarregar a página.');
  });
}

/* ---------- Visão da Sala de Situação ---------- */
function painelCooperacao() {
  const l = bloqueios();
  const porSec = SECRETARIAS.map(s => {
    const minhas = PROJETOS.flatMap(p => etapasDe(p).filter(e => e.sec === s.id).map(e => ({ p, e })));
    return {
      s, atrasadas: minhas.filter(x => estadoEtapa(x.p, x.e) === 'atr').length,
      retendo: new Set(l.filter(b => b.causa.sec === s.id).map(b => b.p.id + b.causa.id)).size,
      aguardando: minhas.filter(x => estadoEtapa(x.p, x.e) === 'agu').length
    };
  }).filter(x => x.atrasadas || x.retendo || x.aguardando).sort((a, b) => b.retendo - a.retendo || b.atrasadas - a.atrasadas);
  return `<div id="sec-cooperacao" class="grid gap-4 mt-4 2xl:grid-cols-[minmax(0,1.7fr)_minmax(0,1fr)] items-start">
    ${painel('Quem Está Esperando por Quem', tabela([
      { t: 'Quem espera', f: b => `<span class="font-semibold">${siglaSec(b.etapa.sec)}</span><span class="block text-[12px] text-ink-2">${esc(b.etapa.nome)}</span>` },
      { t: 'Está esperando', f: b => `<span class="font-semibold">${siglaSec(b.causa.sec)}</span><span class="block text-[12px] text-ink-2">${esc(b.causa.nome)}</span>` },
      { t: 'Situação da causa', f: b => etapaVencida(b.causa) ? `<span class="badge-atr">■ Vencida há ${diasEntre(b.causa.fim, HOJE)} dias</span>` : `<span class="badge-ate">▲ Prazo em ${fData(b.causa.fim)}</span>` },
      { t: 'Projeto', f: b => linkProjeto(b.p, 'secretarias') },
      { t: 'Etapas afetadas', num: true, f: b => 1 + dependentesDe(b.p, b.etapa.id).length }
    ], l, { legenda: 'Dependências que retêm etapas', vazio: 'Nenhuma etapa retida por dependência.' }), { pad: false, sub: 'Dependências entre etapas que estão retendo o trabalho' })}
    ${painel('Etapas por Secretaria', tabela([
      { t: 'Secretaria', f: x => `<span class="font-medium">${x.s.nome}</span>` },
      { t: 'Atrasadas', num: true, f: x => x.atrasadas }, { t: 'Retendo outras', num: true, f: x => x.retendo }, { t: 'Aguardando', num: true, f: x => x.aguardando }
    ], porSec, { legenda: 'Etapas atrasadas, que retêm outras e aguardando, por Secretaria', vazio: 'Sem etapas atrasadas ou retidas.' }), { pad: false, sub: 'Não altera o IDS' })}
  </div>`;
}

/* ---------- Linhas de Secretarias no cadastro de projeto ---------- */
let seqEnvolvida = 0;
function linhaEnvolvidaNova() {
  const n = ++seqEnvolvida;
  return `<div class="grid gap-3 sm:grid-cols-2 p-3 border border-line-strong rounded-[3px] sm:col-span-2" data-linha-env="${n}">
    ${campo(`nv-sec-${n}`, 'Secretaria', `<select id="nv-sec-${n}" data-nv="sec" class="input">${opcoes(SECRETARIAS.map(s => [s.id, s.nome]), '', 'Selecione')}</select>`, { obrig: true })}
    ${campo(`nv-papel-${n}`, 'Papel', `<select id="nv-papel-${n}" data-nv="papel" class="input">${opcoes(Object.entries(PAPEIS), '', 'Selecione')}</select>`, { obrig: true })}
    ${campo(`nv-atr-${n}`, 'O que deve fazer', `<input id="nv-atr-${n}" data-nv="atribuicao" class="input" maxlength="200">`, { obrig: true })}
    ${campo(`nv-contato-${n}`, 'Pessoa de contato', `<input id="nv-contato-${n}" data-nv="contato" class="input" maxlength="80">`, { obrig: true })}
    <div class="sm:col-span-2 text-right"><button type="button" class="btn-ghost !h-8" data-retirar-env>Retirar esta Secretaria</button></div>
  </div>`;
}
function regrasEnvolvidasNovas(form) {
  const regras = {};
  const linhas = [...form.querySelectorAll('[data-linha-env]')];
  linhas.forEach((l, i) => {
    const n = l.dataset.linhaEnv;
    regras[`nv-sec-${n}`] = x => !x ? 'Selecione a Secretaria ou retire a linha.' : x === form.querySelector('#np-sec').value ? 'Esta já é a coordenadora.'
      : linhas.slice(0, i).some(o => o.querySelector('[data-nv="sec"]').value === x) ? 'Secretaria repetida.' : '';

  });

}
const lerEnvolvidasNovas = form => [...form.querySelectorAll('[data-linha-env]')].map(l => ({ ...Object.fromEntries([...l.querySelectorAll('[data-nv]')].map(c => [c.dataset.nv, c.value.trim()])), aporte: 0 }));

/* ============================================================
   DECISÕES E TAREFAS DAS REUNIÕES
   Cada decisão registrada vira uma tarefa, com responsável e prazo.
   Registrar ou concluir não altera situação, prioridade nem o IDS.
   Como o restante da demonstração, vale até recarregar a página.
   ============================================================ */
const TAREFAS = [];
let seqTarefa = 0;
const anotarHistorico = (p, data, acao, autor, categoria = 'Decisão') => (p.registros || (p.registros = [])).push({ data, categoria, acao: `<span class="quebra">${acao}</span>`, autor });
/* a tarefa nasce de uma reunião ou de uma conversa; "reuniao" guarda a data de uma ou de outra */
const nomeOrigem = t => t.origem === 'conversa' ? 'conversa' : 'reunião';

function registrarDecisao(p, { texto, resp, reuniao, prazo, origem = 'reuniao' }, { data = HOJE, autor = 'Usuário da demonstração' } = {}) {
  const t = { id: 't' + String(++seqTarefa).padStart(2, '0'), proj: p.id, texto, resp, reuniao, prazo, origem, concluida: null, feito: '' };
  TAREFAS.push(t);
  anotarHistorico(p, data, `Decisão registrada: “${esc(texto)}” Responsável: ${esc(resp)}. Prazo: ${fData(prazo)}. ${origem === 'conversa' ? 'Conversa' : 'Reunião'} de ${fData(reuniao)}.`, autor);
  return t;
}

/* Conversa com o Prefeito: registro escrito, em qualquer projeto. Só vira tarefa (com prazo e cobrança) se a pessoa marcar.
   O texto da conversa fica apenas no bloco da ficha: o Histórico e os documentos em PDF não o repetem. */
const CONVERSAS = [];
let seqConversa = 0;
function registrarConversa(p, { data, participantes, resumo, tarefa = null }) {
  const t = tarefa ? registrarDecisao(p, { ...tarefa, reuniao: data, origem: 'conversa' }) : null;
  const c = { id: 'c' + String(++seqConversa).padStart(2, '0'), proj: p.id, data, participantes, resumo, tarefa: t ? t.id : '' };
  CONVERSAS.push(c);
  anotarHistorico(p, HOJE, `Conversa registrada, de ${fData(data)}. Participantes: ${esc(participantes)}.${t ? ' Gerou uma tarefa.' : ' Sem tarefa.'}`, 'Usuário da demonstração', 'Conversa');
  return c;
}
const conversasDoProjeto = id => CONVERSAS.filter(c => c.proj === id);
function concluirTarefa(t, feito, { data = HOJE, autor = 'Usuário da demonstração' } = {}) {
  if (t.concluida) return;
  Object.assign(t, { concluida: data, feito });
  anotarHistorico(projDe(t.proj), data, `Tarefa concluída: “${esc(t.texto)}” O que foi feito: ${esc(feito)}`, autor);
}

/* [projeto, decisão, responsável, prazo, concluída em, o que foi feito] — reunião fictícia de 28/10/2026 */
[
