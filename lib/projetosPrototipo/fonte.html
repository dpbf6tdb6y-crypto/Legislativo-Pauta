});

const tarefaDe = id => TAREFAS.find(t => t.id === id);
const tarefasDoProjeto = id => TAREFAS.filter(t => t.proj === id);
/* "Hoje" é sempre a data de posição. Aberta inclui as vencidas. */
const tarefaAberta = t => !t.concluida;
const tarefaVencida = t => tarefaAberta(t) && t.prazo < HOJE;
const SIT_TAREFA = { abertas: ['Abertas', tarefaAberta], vencidas: ['Vencidas', tarefaVencida], concluidas: ['Concluídas', t => !!t.concluida] };
const textoVencida = t => { const n = diasEntre(t.prazo, HOJE); return `Vencida há ${n} ${n === 1 ? 'dia' : 'dias'}`; };
function seloTarefa(t) {
  if (t.concluida) return `<span class="badge-con"><span aria-hidden="true" class="text-[10px]">✓</span>Concluída em ${fData(t.concluida)}</span>`;
  if (tarefaVencida(t)) return `<span class="badge-atr"><span aria-hidden="true" class="text-[10px]">■</span>${textoVencida(t)}</span>`;
  return `<span class="badge-and"><span aria-hidden="true" class="text-[10px]">●</span>${+t.prazo === +HOJE ? 'Aberta · vence hoje' : 'Aberta no prazo'}</span>`;
}
/* vencidas primeiro, depois as abertas no prazo e as concluídas; em cada grupo, do prazo mais antigo ao mais novo */
const grupoTarefa = t => t.concluida ? 2 : tarefaVencida(t) ? 0 : 1;
const ordenarTarefas = l => [...l].sort((a, b) => grupoTarefa(a) - grupoTarefa(b) || a.prazo - b.prazo || a.reuniao - b.reuniao);

/* Gestores ativos mais os órgãos que o protótipo já usa como responsáveis por riscos e pendências */
function responsaveisPossiveis() {
  const gestores = GESTORES.filter(g => g.status === 'Ativo').map(g => g.nome);
  const orgaos = [...Object.values(RISCOS_ESPECIFICOS).flatMap(l => l.map(r => r[4])), ...PENDENCIAS.map(d => d.resp)]
    .filter(n => !GESTORES.some(g => g.nome === n));
  const emOrdemAlfabetica = l => [...new Set(l)].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  return { gestores: emOrdemAlfabetica(gestores), orgaos: emOrdemAlfabetica(orgaos) };
}

/* ---------- Aba "Tarefas das reuniões", na tela Pendências ---------- */

function ligarPendencias(raiz) {
  const caixa = () => raiz.querySelector('#painel-pendencias');
  const redesenhar = foco => { caixa().innerHTML = conteudoTarefas(); caixa().querySelector(foco)?.focus(); };
  const abrirAba = k => {
    PEND.aba = k;
    history.replaceState(null, '', k === 'tarefas' ? '#pendencias-tarefas' : '#pendencias');
    redesenharTela('#aba-pend-' + k);
  };
  /* endereços de atalho viram o endereço comum da aba, para um novo clique no atalho voltar a funcionar */
  if (PEND.aba === 'tarefas') history.replaceState(null, '', '#pendencias-tarefas');
  raiz.addEventListener('click', e => {
    const aba = e.target.closest('[data-aba-pend]'); if (aba) return abrirAba(aba.dataset.abaPend);
    const sit = e.target.closest('[data-sit-tarefa]');
    if (sit) { const k = sit.dataset.sitTarefa; PEND.sit = PEND.sit === k ? '' : k; return redesenhar(`[data-sit-tarefa="${k}"]`); }
    if (e.target.closest('[data-limpar-tarefas]')) { Object.assign(PEND, { sit: '', sec: '', resp: '' }); return redesenhar('#tf-sec'); }
    const c = e.target.closest('[data-concluir-tarefa]'); if (c) abrirConclusao(tarefaDe(c.dataset.concluirTarefa));
  });
  raiz.addEventListener('change', e => {
    const k = e.target.dataset.filtroTarefa;
    if (k) { PEND[k] = e.target.value; redesenhar('#tf-' + k); }
  });
  raiz.addEventListener('keydown', e => {
    if (!e.target.matches('[data-aba-pend]')) return;
    const outra = e.target.dataset.abaPend === 'tarefas' ? 'documentos' : 'tarefas';
    const k = { ArrowRight: outra, ArrowLeft: outra, Home: 'documentos', End: 'tarefas' }[e.key];
    if (!k) return;
    e.preventDefault(); abrirAba(k);
  });
}
/* depois de abrir o link de uma tarefa, leva a tela até a linha dela */
function focarTarefa() {
  const el = PEND.foco && document.getElementById('linha-' + PEND.foco);
  PEND.foco = '';
  if (el) { el.scrollIntoView({ block: 'center' }); el.focus({ preventScroll: true }); }
}

const todosRiscos = () => PROJETOS.flatMap(p => riscos(p).map(r => ({ p, desc: r[0], prob: r[1], imp: r[2], resp: r[3], dono: r[4], score: r[1] * r[2] }))).sort((a, b) => b.score - a.score || b.p.orc - a.p.orc);

/* ---------- Design System ---------- */
function contraste(a, b) {
  const L = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
  const [x, y] = [L(a), L(b)].sort((m, n) => n - m); return (x + .05) / (y + .05);
}

   Dados pessoais: somente nomes e funções. Sem telefone ou e-mail.
   ============================================================ */
const EMISSAO = { perfil: 'Equipe de Planejamento' };
const TITULO_PADRAO = document.title;
const fDataHora = d => `${fData(d)} às ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
const situacaoTexto = k => `${STATUS[k].simbolo} ${STATUS[k].rotulo}`;

/* ---------- Blocos comuns ---------- */
function docCabecalho(titulo, escopo) {
  const meta = [['Posição dos dados', fData(HOJE)], ['Emitido em', `<span data-emissao>${fDataHora(new Date())}</span>`], ['Emitido por (perfil)', `<span data-perfil>${esc(EMISSAO.perfil)}</span>`], ['Escopo e filtros', escopo]];
  return `<header class="doc-topo">
    <div class="doc-orgao"><img class="doc-logo" src="${LOGO_PREFEITURA}" alt="">
      <div><strong>Prefeitura Municipal de <span data-municipio>${esc(CONFIG.municipio)}</span></strong><span>Secretaria de Planejamento e Gestão · Governança de Projetos</span></div>
      <b class="doc-selo">Dados fictícios</b></div>
    <h2>${titulo}</h2>
    <dl class="doc-meta">${meta.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>
  </header>`;
}
const docSecao = (titulo, corpo, junto = false) => `<section class="doc-secao ${junto ? 'doc-junto' : ''}"><h3>${titulo}</h3>${corpo}</section>`;
const docIndicadores = itens => `<dl class="doc-kpis" style="grid-template-columns:repeat(${itens.length},minmax(0,1fr))">${itens.map(([a, b, c]) => `<div><dt>${a}</dt><dd><b>${b}</b>${c ? `<span>${c}</span>` : ''}</dd></div>`).join('')}</dl>`;
/* colunas = [título, função(item, índice), largura, numérica] */
function docTabela(colunas, itens, legenda, vazio = 'Nenhum registro.') {
  if (!itens.length) return `<p class="doc-vazio">${vazio}</p>`;
  return `<table class="doc-tbl"><caption class="sr-only">${legenda}</caption><colgroup>${colunas.map(c => `<col${c[2] ? ` style="width:${c[2]}"` : ''}>`).join('')}</colgroup>
    <thead><tr>${colunas.map(c => `<th scope="col" class="${c[3] ? 'n' : ''}">${c[0]}</th>`).join('')}</tr></thead>
    <tbody>${itens.map((it, i) => `<tr>${colunas.map(c => `<td class="${c[3] ? 'n' : ''}">${c[1](it, i)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ---------- 1) Relatório executivo da reunião ---------- */
const resumoDecisao = t => `Responsável: ${t.resp} · Prazo: ${fData(t.prazo)} · ${nomeOrigem(t)} de ${fData(t.reuniao)}${t.concluida ? ` · concluída em ${fData(t.concluida)}` : ''}`;
/* sem decisão, a linha fica em branco para ser preenchida na reunião */
function docDeliberacao(p) {
  const l = tarefasDoProjeto(p.id);
  if (!l.length) return '<span class="doc-linha">Deliberação:</span>';
  return l.map(t => `<span class="doc-deliberacao"><strong>Deliberação:</strong> ${esc(t.texto)}<small>${esc(resumoDecisao(t))}</small></span>`).join('');
}
function docReuniao() {
  const r = resumoCarteira(), fila = filaPrioridades();
  const p1 = fila.filter(p => nivelPrioridade(prioridade(p)) === 'P1').length;
  const valorAtraso = soma(r.por.atr, p => p.orc);
  const atrasados = [...r.por.atr].sort((a, b) => b.orc - a.orc);
  const vencidos = PENDENCIAS.filter(d => d.venc < HOJE).sort((a, b) => a.venc - b.venc);
  const rk = ranking();
  return docCabecalho('Relatório Executivo da Reunião de Secretariado', `Carteira completa, sem filtros: ${r.total} projetos de ${rk.length} Secretarias`)
    + docSecao('1. Síntese da carteira', docIndicadores([
      ['Projetos', r.total, `${r.por.con.length} concluídos`], ['Investimento', fMoeda(r.orc), `${fMoeda(r.pago)} pagos`],
      ['Execução física média', fNum(r.execMedia) + '%', `Ponderada: ${fNum(r.execFisica)}%`],
      ['Atrasados', r.por.atr.length, `${fMoeda(valorAtraso)} (${fNum(100 * valorAtraso / r.orc)}%)`], ['Sem atualização', PROJETOS.filter(semAtualizacao).length, `há mais de ${CONFIG.diasSemAtualizacao} dias`]])
      + docTabela([['Situação', k => situacaoTexto(k)], ['Projetos', k => r.por[k].length, '18%', true], ['Investimento', k => fMoeda(soma(r.por[k], p => p.orc)), '22%', true], ['% do investimento', k => fNum(100 * soma(r.por[k], p => p.orc) / r.orc) + '%', '22%', true]], ORDEM_STATUS, 'Projetos por situação'), true)
    + docSecao('2. Decisões solicitadas ao Gabinete', `<p class="doc-nota">${fila.length} projetos na fila de prioridades, ${p1} em P1 (maior urgência). Registrar a deliberação de cada item na reunião.</p>`
      + docTabela([
        ['Prior.', p => `<strong>${nivelPrioridade(prioridade(p))}</strong>`, '7%'],
        ['Projeto', p => `<strong>${esc(p.nome)}</strong><small>${secDe(p.sec).sigla} · ${fMoeda(p.orc)} · risco ${p.risco.toLowerCase()}</small>`, '31%'],
        ['Situação', p => `${situacaoTexto(p.status)}<small>Físico: ${p.fisico}%</small><small>Planejado: ${fNum(planejadoEm(p, HOJE))}%</small>`, '19%'],
        ['Encaminhamento proposto e deliberação', p => `${esc(encaminhamento(p))}${docDeliberacao(p)}`]
      ], fila, 'Decisões solicitadas', 'Nenhum projeto na fila de prioridades.'))
    + docSecao('3. Projetos atrasados', docTabela([
      ['Projeto', p => `${esc(p.nome)}<small>${esc(nomeGestor(p.gestor))}</small>`, '40%'], ['Secretaria', p => secDe(p.sec).sigla],
      ['Prazo', p => fData(p.prazo) + (p.prazo < HOJE ? '<small>vencido</small>' : ''), '14%', true], ['Físico / planejado', p => `${p.fisico}% / ${fNum(planejadoEm(p, HOJE))}%`, '16%', true], ['Investimento', p => fMoeda(p.orc), '15%', true]
    ], atrasados, 'Projetos atrasados', 'Nenhum projeto atrasado.'))
    + docSecao('4. Desempenho das Secretarias', docTabela([
      ['Posição', (x, i) => `${i + 1}º`, '10%'], ['Secretaria', x => x.s.nome], ['Projetos', x => x.d.lista.length, '12%', true], ['Atrasados', x => x.d.lista.filter(p => p.status === 'atr').length, '12%', true], ['IDS', x => `<strong>${x.d.ids}</strong>`, '9%', true], ['Meta ' + CONFIG.metaIDS, x => x.d.ids >= CONFIG.metaIDS ? '✓ Na meta' : '▲ Abaixo', '16%']
    ], rk, 'Desempenho das secretarias'), true)
    + docSecao('5. Documentos vencidos', docTabela([
      ['Documento', d => d.doc, '36%'], ['Projeto', d => esc(projDe(d.proj).nome), '32%'], ['Venceu em', d => fData(d.venc), '13%', true], ['Responsável', d => esc(d.resp)]
    ], vencidos, 'Documentos vencidos', 'Nenhum documento vencido.'))
    + `<p class="doc-criterios"><strong>Critérios (proposta em validação).</strong> Atrasado: prazo vencido ou execução física ${CONFIG.limiteAtraso} pontos ou mais abaixo do planejado. Atenção: desvio de ${CONFIG.limiteAtencao} pontos ou mais, ou mais de ${CONFIG.diasSemAtualizacao} dias sem atualização. IDS: 50% aderência ao cronograma, 30% pontualidade e 20% atualização em dia. A prioridade considera situação, risco, atualização, documentos vencidos e valor.</p>`;
}

/* ---------- 2) Ficha do projeto ---------- */
/* Curva em SVG de proporção fixa: não depende da largura medida na hora de imprimir */
function docCurva(titulo, c, nomePlan, nomeReal) {
  const W = 340, H = 150, e = 32, d = 8, t = 14, b = 18, iw = W - e - d, ih = H - t - b, n = c.rotulos.length;
  const x = i => e + iw * i / Math.max(1, n - 1), y = v => t + ih - ih * v / 100;
  const ult = c.real.reduce((a, v, i) => v == null ? a : i, 0);
  /* as amostras são mensais: "Hoje" e o último realizado vão para o dia exato dentro do mês */
  const xHoje = c.hojeIdx == null ? null : x(c.hojeIdx + (HOJE.getDate() - 1) / 30);
  const xReal = i => i === ult && c.hojeIdx === ult ? xHoje : x(i);
  const linha = (vs, px) => vs.map((v, i) => v == null ? null : `${px(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${titulo}: ${nomeReal} ${fNum(c.real[ult])}%">`;
  [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${e}" x2="${W - d}" y1="${y(v)}" y2="${y(v)}" stroke="#DDE2E9"/><text x="${e - 5}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`; });
  [[0, 'start'], [Math.round((n - 1) / 2), 'middle'], [n - 1, 'end']].forEach(([i, a]) => { s += `<text x="${x(i)}" y="${H - 4}" text-anchor="${a}">${c.rotulos[i]}</text>`; });
  if (c.hojeIdx != null) s += `<line x1="${xHoje}" x2="${xHoje}" y1="${t}" y2="${t + ih}" stroke="#7C8796" stroke-dasharray="2 3"/><text x="${xHoje}" y="${t - 4}" text-anchor="middle">Hoje</text>`;
  s += `<polyline points="${linha(c.plan, x)}" fill="none" stroke="#586373" stroke-width="1.6" stroke-dasharray="5 3"/><polyline points="${linha(c.real, xReal)}" fill="none" stroke="#146484" stroke-width="2.6"/><circle cx="${xReal(ult)}" cy="${y(c.real[ult])}" r="3.5" fill="#146484" stroke="#fff" stroke-width="1.5"/></svg>`;
  return `<figure><figcaption><strong>${titulo}</strong><span>- - - ${nomePlan} &nbsp; ━ ${nomeReal}</span></figcaption>${s}</figure>`;
}

function docFicha(p) {
  const s = secDe(p.sec), ms = marcos(p), feitos = ms.filter(m => m.estado === 'feito').length, dr = diasRestantes(p), conc = p.status === 'con';
  const docs = PENDENCIAS.filter(d => d.proj === p.id).sort((a, b) => a.venc - b.venc);
  const nivel = prioridade(p) >= 40 ? nivelPrioridade(prioridade(p)) : '';
  const identificacao = [['Secretaria', s.nome], ['Gestor responsável', esc(nomeGestor(p.gestor))], ['Situação', situacaoTexto(p.status)], ['Grau de risco', p.risco],
    ['Investimento total', fMoeda(p.orc)], ['Início e prazo', `${fData(p.inicio)} a ${fData(p.prazo)}`], [conc ? 'Encerramento' : dr < 0 ? 'Dias de atraso' : 'Dias restantes', conc ? 'Concluído' : fNum(Math.abs(dr))], ['Última atualização', `${fData(p.atualizado)} (${fHa(p.atualizado)})`]];
  let n = 0;
  const numerada = (titulo, conteudo, junto) => docSecao(`${++n}. ${titulo}`, conteudo, junto);
  const coop = [{ sec: p.sec, papel: '', atribuicao: 'Responde pelo resultado e acompanha todas as etapas.', contato: nomeGestor(p.gestor) }, ...envolvidasDe(p)];
  const retidas = bloqueiosDoProjeto(p);
  return docCabecalho('Ficha do Projeto Estratégico', `Projeto ${p.codigo}, todas as informações vigentes`)
    + `<div class="doc-projeto"><p class="doc-codigo">${p.codigo} · ${p.eixo}</p><h4>${esc(p.nome)}</h4><dl class="doc-meta">${identificacao.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl></div>`
    + numerada('Resumo executivo', `<p>${esc(p.objetivo)}</p><p>${situacaoGabinete(p)}</p><div class="doc-destaque"><strong>Encaminhamento ao Gabinete${nivel ? ` · prioridade ${nivel}` : ''}</strong>${conc ? 'Sem decisão pendente.' : esc(encaminhamento(p))}</div>`, true)
    + numerada('Execução', docIndicadores([
      ['Execução física', p.fisico + '%', conc ? 'Objeto entregue' : `Planejado: ${fNum(planejadoEm(p, HOJE))}%`], ['Execução financeira', p.pagP + '%', 'Valor pago'], ['Marcos concluídos', `${feitos} de ${ms.length}`, `${ms.filter(m => m.estado === 'atrasado').length} atrasado(s)`], ['Percentual geral', percentualGeral(p) + '%', 'Físico, financeiro e marcos']])
      + `<div class="doc-curvas">${docCurva('Progresso físico', curvas(p, p.fisico), 'Planejado', 'Realizado')}${docCurva('Progresso financeiro', curvas(p, p.pagP), 'Previsto', 'Pago')}</div>`
      + docTabela([['Estágio da despesa', x => x[0]], ['Valor', x => fMoeda(valorDe(p, x[1])), '25%', true], ['% do previsto', x => x[1] + '%', '25%', true]], [['Previsto', 100], ['Empenhado', p.empP], ['Liquidado', p.liqP], ['Pago', p.pagP]], 'Estágios da despesa'), true)
    + numerada('Secretarias e responsabilidades', docTabela([['Secretaria', x => secDe(x.sec).nome, '20%'], ['Papel', x => x.papel ? PAPEIS[x.papel] : '<strong>Coordenadora</strong>', '15%'], ['O que deve fazer', x => esc(x.atribuicao)], ['Contato', x => esc(x.contato), '18%']], coop, 'Secretarias do projeto'), true)
    + numerada('Etapas e dependências', docTabela([['Ordem', e => `${ordemEtapa(p, e)}ª`, '8%'], ['Etapa', e => `${numeroEtapa(p, e)}. ${esc(e.nome)}`], ['Resp.', e => siglaSec(e.sec), '11%'], ['Período', e => `${fData(e.inicio)} a ${fData(e.fim)}`, '19%'], ['Depende de', e => numerosDe(p, predecessoras(p, e)) || 'Nenhuma', '10%'], ['Situação', e => { const k = estadoEtapa(p, e); return `${ESTADO_ETAPA[k][2]} ${ESTADO_ETAPA[k][0]}`; }, '15%']], emOrdem(p), 'Etapas e dependências', 'Nenhuma etapa cadastrada.')
      + (retidas.length ? `<div class="doc-destaque doc-bloqueios"><strong>Quem está esperando por quem</strong>${retidas.map(b => `<div>${fraseBloqueio(b)}</div>`).join('')}</div>` : '')
      + (etapasDe(p).length ? `<p class="doc-nota">Mesma ordem: etapas sem dependência entre si. ${textoProjecao(p)} A estimativa supõe concluir hoje o que está vencido e manter as durações.</p>` : ''), true)
    + numerada('Marcos', docTabela([['Marco', m => m.nome], ['Data prevista', m => fData(m.data), '18%', true], ['Situação', m => `${ESTADO_MARCO[m.estado][2]} ${ESTADO_MARCO[m.estado][0]}`, '20%']], ms, 'Marcos do projeto'), true)
    + numerada('Riscos', docTabela([['Risco', x => x[0], '34%'], ['P × I', x => `${x[1]} × ${x[2]}`, '9%', true], ['Grau', x => grauRisco(x[1] * x[2]), '10%'], ['Resposta e responsável', x => `${x[3]}<small>${esc(x[4])}</small>`]], riscos(p), 'Riscos do projeto', 'Sem riscos abertos.'), true)
    + numerada('Outras dependências', docTabela([['Dependência', x => x[0], '40%'], ['Responsável externo', x => x[1]], ['Data-limite', x => fData(dISO(x[3])), '15%', true], ['Situação', x => x[2], '15%']], dependencias(p), 'Dependências', 'Nenhuma dependência aberta.'), true)
    + numerada('Pendências documentais', docTabela([['Documento', x => x.doc, '48%'], ['Responsável', x => esc(x.resp)], ['Vencimento', x => fData(x.venc), '15%', true], ['Situação', x => x.venc < HOJE ? '■ Vencido' : '▲ Pendente', '15%']], docs, 'Pendências documentais', 'Nenhuma pendência documental registrada.'), true)
    + numerada('Últimas atualizações', docTabela([['Data', h => fData(h.data), '15%'], ['Registro', h => h.acao], ['Responsável', h => esc(h.autor), '24%']], historico(p).slice(0, 4), 'Últimas atualizações'), true);
}

/* ---------- Tela de pré-visualização ---------- */
/* seletor sem opção vazia: o documento sempre tem projeto e perfil definidos */
const listaOpcoes = (pares, sel) => pares.map(([v, t]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
const MODELOS_FUTUROS = [['Por Secretaria', 'Carteira, execução e pendências de uma pasta'], ['Execução orçamentária', 'Previsto, empenhado, liquidado e pago'], ['Registro de riscos', 'Matriz e plano de resposta'], ['Controle interno', 'Documentos vencidos e trilha de auditoria']];

function telaRelatorio(modelo, p) {
  const ficha = modelo === 'ficha';
  document.title = ficha ? `Demonstracao - Ficha ${p.codigo} - ${isoDe(HOJE)}` : `Demonstracao - Relatorio de reuniao - ${isoDe(HOJE)}`;
  const item = (href, t, d, atual) => `<li><a class="block px-4 py-3 hover:bg-navy-50 ${atual ? 'bg-navy-50' : ''}" href="#${href}" ${atual ? 'aria-current="true"' : ''}><span class="block font-semibold text-navy-900">${t}</span><span class="block text-[12px] text-ink-3">${d}</span></a></li>`;
  const perfis = PERFIS.filter(x => x[4] === 'Sim').map(x => x[0]);
  const ordenados = [...PROJETOS].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  return `<div data-oculta-impressao>${cabecalho('Relatórios', 'Documentos em A4 para reuniões de gabinete e secretariado.')}</div>
  <div class="doc-layout">
    <aside class="grid gap-4 content-start" data-oculta-impressao aria-label="Opções do relatório">
      ${painel('Emissão', `<div class="grid gap-3">
        ${ficha ? `<div><label class="field-label" for="rl-proj">Projeto</label><select id="rl-proj" class="input">${listaOpcoes(ordenados.map(x => [x.id, x.nome]), p.id)}</select></div>` : ''}
        <div><label class="field-label" for="rl-perfil">Emitido por (perfil)</label><select id="rl-perfil" class="input">${listaOpcoes(perfis.map(x => [x, x]), EMISSAO.perfil)}</select><p class="field-help m-0">No sistema real, será o usuário autenticado.</p></div>
        <button type="button" class="btn-primary" data-acao="gerar-pdf">${icone('relatorio')}Gerar PDF</button>
        <p class="field-help m-0">Na janela de impressão, escolha <strong>Salvar como PDF</strong>, papel A4.</p>
        ${ficha ? `<a class="btn-secondary" href="#projeto-${p.id}">Voltar ao projeto</a>` : `<button type="button" class="btn-secondary" data-acao="copiar-relatorio">${icone('copiar')}Copiar texto</button>`}
      </div>`)}
      ${painel('Modelos', `<ul class="rows list-none m-0 p-0">${item('relatorios', 'Relatório executivo da reunião', 'Síntese, decisões e desempenho', !ficha)}${item('ficha-' + (ficha ? p.id : 'p01'), 'Ficha do projeto', 'Situação, execução, marcos e riscos', ficha)}${MODELOS_FUTUROS.map(([t, d]) => `<li class="px-4 py-3"><div class="font-semibold text-ink-2">${t}</div><div class="text-[12px] text-ink-3">${d}</div><div class="mt-1"><span class="badge-neutro">Previsto para a próxima etapa</span></div></li>`).join('')}</ul>`, { pad: false })}
    </aside>
    <article class="doc" aria-label="Pré-visualização do documento">${ficha ? docFicha(p) : docReuniao()}</article>
  </div>`;
}
VIEWS.relatorios = () => telaRelatorio('reuniao');
VIEWS.ficha = id => {
  const p = projDe(id);
  return p ? telaRelatorio('ficha', p) : cabecalho('Projeto não encontrado', 'Verifique o endereço ou consulte a carteira.', '<a class="btn-primary" href="#projetos">Ver todos os projetos</a>');
};

const carimbarEmissao = () => document.querySelectorAll('[data-emissao]').forEach(el => (el.textContent = fDataHora(new Date())));
addEventListener('beforeprint', carimbarEmissao);

function gerarPdf() {
  /* Visualizadores com restrição ignoram a impressão sem avisar: detectar e orientar */
  let abriu = false;
  const marcar = () => (abriu = true);
  addEventListener('beforeprint', marcar, { once: true });
  try { window.print(); } catch (e) { /* tratado abaixo */ }
  setTimeout(() => {
    removeEventListener('beforeprint', marcar);
    if (!abriu) aviso('Este visualizador bloqueou a impressão. Use "Abrir em tela inteira" e gere o PDF por lá.');
  }, 800);
}

function ligarRelatorio(raiz) {
  raiz.addEventListener('click', e => { if (e.target.closest('[data-acao="gerar-pdf"]')) gerarPdf(); });
  raiz.addEventListener('change', e => {
    if (e.target.id === 'rl-proj') location.hash = 'ficha-' + e.target.value;
    if (e.target.id === 'rl-perfil') { EMISSAO.perfil = e.target.value; raiz.querySelector('[data-perfil]').textContent = EMISSAO.perfil; }
  });
}

  [null, [['painel', 'Dashboard', 'painel']]],
  ['Projetos', [['projetos', 'Todos os Projetos', 'lista'], ['novo-projeto', 'Novo Projeto', 'novo'], ['portfolio', 'Portfólio', 'portfolio']]],
  ['Cadastros', [['secretarias', 'Secretarias', 'predio'], ['gestores', 'Gestores', 'pessoas']]],
  ['Monitoramento Estratégico', [['sala', 'Sala de Situação', 'sala'], ['alertas', 'Alertas', 'sino'], ['pendencias', 'Pendências', 'doc'], ['riscos', 'Riscos', 'escudo'], ['indicadores', 'Indicadores', 'grafico']]],
  [null, [['relatorios', 'Relatórios', 'relatorio'], ['configuracoes', 'Configurações', 'config']]]
];

function montarEstrutura() {
  document.getElementById('app').innerHTML = `
  <a class="skip" href="#conteudo" id="pular">Pular para o conteúdo</a>
  <div id="veu" class="fixed inset-0 z-30 bg-navy-950/60 lg:hidden" hidden></div>
  <aside id="lateral" class="fixed inset-y-0 left-0 z-40 w-[256px] flex-col bg-navy-50 text-ink border-r border-line-strong overflow-y-auto hidden lg:flex" aria-label="Menu principal">
    <div class="faixa-marca flex-none" aria-hidden="true"></div>
    <div class="flex items-start gap-3 px-5 py-4 border-b border-line">
      <div class="min-w-0 flex-1"><img src="${LOGO_PREFEITURA}" alt="Prefeitura de Nova Lima: o futuro mora aqui" width="200" height="78" class="block w-full max-w-[200px] h-auto"><div class="mt-2.5 text-[11.5px] font-semibold leading-tight text-navy-900">Governança e Gestão de Projetos</div></div>
      <button type="button" id="fechar-menu" class="lg:hidden bg-transparent border-0 text-ink-2 p-1 cursor-pointer" aria-label="Fechar menu">${icone('fechar')}</button>
    </div>
    <nav class="flex-1 pb-4 pt-2">${MENU.map(([g, itens]) => `${g ? `<p class="nav-group m-0">${g}</p>` : '<div class="h-2"></div>'}<ul class="list-none m-0 p-0">${itens.map(([r, t, i]) => `<li><a class="nav-link" href="#${r}" data-rota="${r}">${icone(i)}${t}</a></li>`).join('')}</ul>`).join('')}</nav>
    <div class="px-5 py-3 border-t border-line text-[11.5px] text-ink-3">Protótipo com dados fictícios</div>
  </aside>
  <div id="area" class="lg:pl-[256px] min-h-screen flex flex-col">
    <header id="topo" class="sticky top-0 z-20 bg-white border-b border-line-strong">
      <div class="flex items-center gap-3 px-4 sm:px-6 h-[60px]">
        <button type="button" id="abrir-menu" class="btn-secondary !px-2.5 lg:!hidden" aria-label="Abrir menu" aria-expanded="false" aria-controls="lateral">${icone('menu')}</button>
        <div class="hidden md:block min-w-0 pr-4 border-r border-line"><div class="text-[11px] font-semibold uppercase tracking-[0.08em] text-ink-3">Prefeitura Municipal</div><div class="font-semibold text-navy-950 leading-tight truncate" data-municipio>${esc(CONFIG.municipio)}</div></div>
        <div class="relative flex-1 min-w-0 max-w-[460px]">
          <label for="busca" class="sr-only">Buscar projetos</label>
          <span class="absolute left-2.5 top-[9px] text-ink-3">${icone('busca')}</span>
          <input id="busca" type="search" class="input !pl-9" placeholder="Buscar projeto" autocomplete="off" aria-controls="resultados" aria-expanded="false">
          <div id="resultados" class="absolute left-0 right-0 top-[42px] z-30 bg-white border border-line-strong shadow-lg max-h-[320px] overflow-y-auto min-w-[240px]" hidden></div>
        </div>
        <div class="ml-auto flex items-center gap-3">
          <button type="button" id="apresentar" class="btn-secondary !hidden sm:!inline-flex" aria-pressed="false">${icone('tela')}<span>Modo apresentação</span></button>
          <div class="hidden xl:block text-right leading-tight"><div class="text-[13px] font-semibold">Gabinete do Prefeito</div><div class="text-[12px] text-ink-3">Dados de ${fData(HOJE)}</div></div>
        </div>
      </div>
    </header>
    <main id="conteudo" tabindex="-1" class="flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 py-6 min-w-0"></main>
    <footer class="px-4 sm:px-6 py-4 border-t border-line text-[12px] text-ink-3">Prefeitura de Nova Lima · Demonstração. Pessoas, projetos e valores são fictícios.</footer>
  </div>
  <div id="aviso" role="status" aria-live="polite" class="fixed z-50 bottom-4 right-4 left-4 sm:left-auto max-w-[420px] bg-navy-950 text-white px-4 py-3 rounded-[3px] shadow-lg" hidden></div>
  <div id="copia-manual" class="fixed z-50 bottom-4 right-4 left-4 sm:left-auto sm:w-[460px] panel p-4 shadow-xl" hidden><label class="field-label" for="copia-texto">A cópia automática foi bloqueada. Copie o texto selecionado com Ctrl+C.</label><textarea id="copia-texto" class="input" rows="6" readonly></textarea><button type="button" class="btn-secondary mt-2" id="fechar-copia">Fechar</button></div>
  <div id="tooltip" role="presentation" hidden></div>
  <dialog id="dialogo" class="dialogo panel shadow-xl" aria-labelledby="dialogo-titulo" data-oculta-impressao></dialog>`;
}

const SIMPLES = ['painel', 'projetos', 'novo-projeto', 'portfolio', 'secretarias', 'gestores', 'sala', 'alertas', 'pendencias', 'riscos', 'indicadores', 'relatorios', 'configuracoes', 'design-system'];
function lerRota() {
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^projeto-(p\d+)(?:-([a-z]+))?$/))) return { nome: 'projeto', args: [m[1], m[2]], menu: 'projetos' };
  if ((m = h.match(/^ficha-(p\d+)$/))) return { nome: 'ficha', args: [m[1]], menu: 'relatorios' };
  if ((m = h.match(/^gestor-(novo|g\d+)$/))) return { nome: 'gestor', args: [m[1]], menu: 'gestores' };
  if ((m = h.match(/^pendencias-(tarefas|vencidas)$/))) return { nome: 'pendencias', args: [m[1]], menu: 'pendencias' };
  if ((m = h.match(/^tarefa-(t\d+)$/))) return { nome: 'pendencias', args: ['tarefa', m[1]], menu: 'pendencias' };
  const nome = SIMPLES.includes(h) ? h : 'painel';
  return { nome, args: [], menu: nome };
}
const LIGAR = { projetos: ligarGrade, 'novo-projeto': ligarNovoProjeto, projeto: ligarProjeto, sala: ligarMonitor, alertas: ligarMonitor, riscos: ligarMonitor, pendencias: ligarPendencias, gestores: ligarCadastros, gestor: ligarCadastros, configuracoes: ligarConfig, relatorios: ligarRelatorio, ficha: ligarRelatorio };

function renderizar() {
  const r = lerRota(), main = document.getElementById('conteudo');
  GRAFICOS.clear();
  EDICAO.projeto = ''; /* formulários abertos não atravessam telas */
  document.getElementById('tooltip').hidden = true;
  /* um contêiner novo a cada rota descarta os ouvintes da tela anterior */
  const raiz = document.createElement('div');
  document.title = TITULO_PADRAO; /* as telas de relatório definem o nome sugerido do PDF */
  raiz.innerHTML = VIEWS[r.nome](...r.args);
  main.replaceChildren(raiz);
  LIGAR[r.nome]?.(raiz);
  document.querySelectorAll('[data-rota]').forEach(a => a.dataset.rota === r.menu ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  desenharGraficos();
}

function iniciar() {
  montarEstrutura();
  const $ = id => document.getElementById(id);
  const lateral = $('lateral'), veu = $('veu'), abrir = $('abrir-menu');
  const menu = aberto => {
    lateral.classList.toggle('hidden', !aberto); lateral.classList.toggle('flex', aberto);
    veu.hidden = !aberto; abrir.setAttribute('aria-expanded', aberto);
    if (aberto) $('fechar-menu').focus();
  };
  abrir.addEventListener('click', () => menu(true));
  $('fechar-menu').addEventListener('click', () => { menu(false); abrir.focus(); });
  veu.addEventListener('click', () => menu(false));
  lateral.addEventListener('click', e => { if (e.target.closest('a')) menu(false); });

  $('pular').addEventListener('click', e => { e.preventDefault(); $('conteudo').focus(); });
  $('fechar-copia').addEventListener('click', () => ($('copia-manual').hidden = true));
  $('apresentar').addEventListener('click', e => {
    const on = document.documentElement.classList.toggle('apresentacao');
    e.currentTarget.setAttribute('aria-pressed', on);
    e.currentTarget.querySelector('span').textContent = on ? 'Sair da apresentação' : 'Modo apresentação';
    requestAnimationFrame(desenharGraficos);
  });

  const busca = $('busca'), res = $('resultados');
  const fecharBusca = () => { res.hidden = true; busca.setAttribute('aria-expanded', 'false'); };
  busca.addEventListener('input', () => {
    const q = normal(busca.value.trim());
    if (q.length < 2) return fecharBusca();
    const l = PROJETOS.filter(p => normal(`${p.nome} ${p.codigo} ${nomeGestor(p.gestor)} ${secDe(p.sec).nome} ${secDe(p.sec).sigla}`).includes(q)).slice(0, 7);
    res.innerHTML = l.length ? `<ul class="rows list-none m-0 p-0">${l.map(p => `<li><a class="block px-3 py-2 hover:bg-navy-50" href="#projeto-${p.id}"><span class="block font-medium text-navy-800">${esc(p.nome)}</span><span class="text-[12px] text-ink-3">${secDe(p.sec).sigla} · ${esc(nomeGestor(p.gestor))}</span></a></li>`).join('')}</ul>` : '<p class="m-0 p-3 text-ink-3">Nenhum projeto encontrado.</p>';
    res.hidden = false; busca.setAttribute('aria-expanded', 'true');
  });
  busca.addEventListener('keydown', e => {
    if (e.key === 'Enter' && busca.value.trim()) { Object.assign(GRADE, FILTRO_VAZIO, { q: busca.value.trim(), pagina: 1 }); busca.value = ''; fecharBusca(); location.hash === '#projetos' ? renderizar() : (location.hash = 'projetos'); }
  });
  res.addEventListener('click', () => { busca.value = ''; fecharBusca(); });
  document.addEventListener('click', e => {
    if (!e.target.closest('#busca, #resultados')) fecharBusca();
    const fs = e.target.closest('[data-filtro-sec]');
    if (fs) Object.assign(GRADE, FILTRO_VAZIO, { sec: fs.dataset.filtroSec, pagina: 1 });
    if (e.target.closest('[data-acao="copiar-relatorio"]')) copiar(relatorioTexto(), 'Relatório copiado. Cole no editor de texto.');
    const decidir = e.target.closest('[data-decidir]');
    if (decidir) abrirDecisao(projDe(decidir.dataset.decidir));
    const conversar = e.target.closest('[data-conversar]');
    if (conversar) abrirConversa(projDe(conversar.dataset.conversar));
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    fecharBusca(); $('tooltip').hidden = true;
    if (!veu.hidden) { menu(false); abrir.focus(); }
  });

  const tip = $('tooltip');
  document.addEventListener('pointermove', e => {
    const alvo = e.target.closest?.('[data-dica]');
    if (!alvo) { tip.hidden = true; return; }
    tip.textContent = alvo.getAttribute('data-dica'); tip.style.whiteSpace = 'pre-line'; tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX + 14)) + 'px';
    tip.style.top = (e.clientY + h + 20 > innerHeight ? e.clientY - h - 12 : e.clientY + 16) + 'px';
  });

  let larg = innerWidth, tempo;
  addEventListener('resize', () => { if (innerWidth === larg) return; larg = innerWidth; clearTimeout(tempo); tempo = setTimeout(desenharGraficos, 120); });
  addEventListener('hashchange', () => {
    if (location.hash === '#conteudo') return;
    $('dialogo').close(); /* o formulário aberto não atravessa telas */
    renderizar(); scrollTo(0, 0); document.getElementById('titulo')?.focus({ preventScroll: true });
    focarTarefa();
  });
  renderizar();
  focarTarefa();
  /* Redesenha após o Tailwind aplicar o layout e as fontes carregarem */
  requestAnimationFrame(() => requestAnimationFrame(desenharGraficos));
  addEventListener('load', () => setTimeout(desenharGraficos, 150));
}
iniciar();

</script>
