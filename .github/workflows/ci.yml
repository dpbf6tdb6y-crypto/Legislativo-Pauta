name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (informativo — não trava o CI ainda, há erros pré-existentes)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Rodar testes
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testes dos cálculos do painel Gestão (Python)
        working-directory: scripts/fazenda-atualizador
        run: python -m unittest discover -s tests -v
